  /* =========================================================
   * SHA-256 (비밀번호를 해시값으로만 비교)
   * ========================================================= */
  function sha256(str) {
    const bytes = new TextEncoder().encode(str);
    const K = [], H = [];
    const frac = (x) => ((x - Math.floor(x)) * 4294967296) | 0;
    for (let n = 2, i = 0; i < 64; n++) {
      let prime = true;
      for (let f = 2; f * f <= n; f++) if (n % f === 0) { prime = false; break; }
      if (prime) { if (i < 8) H[i] = frac(Math.pow(n, 1 / 2)); K[i] = frac(Math.pow(n, 1 / 3)); i++; }
    }
    const l = bytes.length, buf = new Uint8Array(((l + 9 + 63) >> 6) << 6);
    buf.set(bytes); buf[l] = 0x80;
    const dv = new DataView(buf.buffer);
    dv.setUint32(buf.length - 8, Math.floor((l * 8) / 4294967296)); dv.setUint32(buf.length - 4, (l * 8) >>> 0);
    const rotr = (x, n) => (x >>> n) | (x << (32 - n));
    const w = new Array(64);
    for (let o = 0; o < buf.length; o += 64) {
      for (let i = 0; i < 16; i++) w[i] = dv.getUint32(o + i * 4) | 0;
      for (let i = 16; i < 64; i++) {
        const a = w[i - 15], b = w[i - 2];
        w[i] = (w[i - 16] + (rotr(a, 7) ^ rotr(a, 18) ^ (a >>> 3)) + w[i - 7] + (rotr(b, 17) ^ rotr(b, 19) ^ (b >>> 10))) | 0;
      }
      let [a, b, c, d, e, f, g, h] = H;
      for (let i = 0; i < 64; i++) {
        const t1 = (h + (rotr(e, 6) ^ rotr(e, 11) ^ rotr(e, 25)) + ((e & f) ^ (~e & g)) + K[i] + w[i]) | 0;
        const t2 = ((rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22)) + ((a & b) ^ (a & c) ^ (b & c))) | 0;
        h = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0;
      }
      [a, b, c, d, e, f, g, h].forEach((v, j) => (H[j] = (H[j] + v) | 0));
    }
    return H.map((x) => (x >>> 0).toString(16).padStart(8, "0")).join("");
  }
  const hashPw = (pw) => sha256("ku-fa::" + pw);

  /* =========================================================

  const lockBtn = $("#lockBtn"), loginM = $("#adminLogin"), panel = $("#admin");

      const b = e.target.closest("[data-act]"); if (!b) return;

      const path = JSON.parse(b.dataset.path), act = b.dataset.act, i = Number(b.dataset.i);

      if (act === "add") {
        const def = getP(window.SITE_DEFAULT_CONFIG, path) || [];
        const proto = target.length ? target[0] : wild(path) in ARR_TPL ? ARR_TPL[wild(path)] : def[0];
        const item = proto === undefined ? "" : blank(clone(proto));
        if (item && typeof item === "object" && "week" in item) item.week = target.length + 1;
        if (item && typeof item === "object") ["assignment", "date"].forEach((k) => delete item[k]);
        target.push(item);
        openSet.add(path.join(".") + "." + (target.length - 1));
      } else if (act === "del") { target.splice(i, 1); }
      else if (act === "up" && i > 0) { [target[i - 1], target[i]] = [target[i], target[i - 1]]; }
      else if (act === "down" && i < target.length - 1) { [target[i + 1], target[i]] = [target[i], target[i + 1]]; }
      else if (act === "addopt") { const o = OPTIONAL[wild(path)].find((x) => x.key === b.dataset.key); target[o.key] = clone(o.tpl); openSet.add(path.join(".")); }
      else if (act === "delopt") { delete target[b.dataset.key]; }
      setDirty(true);
      const st = $("#admBody").scrollTop; viewEdit(); $("#admBody").scrollTop = st;
    });
  }

<script data-part="quiz">

(function () {
  const C = window.SITE_CONFIG, Q = C.quiz || {}, U = window.SITE;
  const { esc, toast } = U;
  const $ = (s, el = document) => el.querySelector(s);
  const $$ = (s, el = document) => [...el.querySelectorAll(s)];
  const K = "fa-site:";
  const ls = {
    get(k, d) { try { const v = localStorage.getItem(K + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(K + k, JSON.stringify(v)); } catch (e) {} },
    del(k) { try { localStorage.removeItem(K + k); } catch (e) {} },
  };
  const ss = {
    get(k) { try { return sessionStorage.getItem(K + k); } catch (e) { return null; } },
    set(k, v) { try { sessionStorage.setItem(K + k, v); } catch (e) {} },
    del(k) { try { sessionStorage.removeItem(K + k); } catch (e) {} },
  };

  const clone = (o) => JSON.parse(JSON.stringify(o));
  const layer = $("#quizLayer");

  /* ── 퀴즈 세트 ── */
  const getSets = () => {
    let sets = ls.get("quiz-sets", null);

    card.innerHTML = `
      <div class="jc-head"><span class="jc-ic">🎮</span><div><small>${esc(Q.lead || "")}</small><h3>${esc(Q.title || "실시간 퀴즈")}</h3></div></div>
      <div class="qz-grid">
        <div class="panel qz-join">
          <h4>🙋 학생 입장</h4>

          <input id="qzPin" inputmode="numeric" maxlength="6" placeholder="PIN 6자리" class="qz-pin-input">
          <input id="qzNick" maxlength="16" placeholder="닉네임" value="${esc(me ? me.name : "")}">

          ` : `
            <p class="muted">퀴즈 만들기·AI 출제·진행은 교수자만 할 수 있어요. 오른쪽 위 🔒 에서 관리자 로그인을 해 주세요.</p>

    } else {
      $("#qzLogin").onclick = () => $("#lockBtn").click();
    }
  }

  function openEditor(setId, showAI) {

    const draw = () => {
      layer.innerHTML = `
        <div class="qz-sheet">
          <header class="qz-sheet-top">
            <h2>✏️ 퀴즈 편집</h2>
            <div class="row-btns"><button class="btn btn-ghost sm" id="edCancel">닫기</button><button class="btn btn-primary sm" id="edSave">저장</button></div>

  function parseAI(text) {
    if (!text) return [];
    let t = String(text).replace(/```(json)?/gi, "").trim();
    let obj = null;
    const tryParse = (s) => { try { return JSON.parse(s); } catch (e) { return null; } };
    obj = tryParse(t);
    if (!obj) { const a = t.indexOf("{"), b = t.lastIndexOf("}"); if (a >= 0 && b > a) obj = tryParse(t.slice(a, b + 1)); }
    if (!obj) { const a = t.indexOf("["), b = t.lastIndexOf("]"); if (a >= 0 && b > a) obj = tryParse(t.slice(a, b + 1)); }
    const arr = Array.isArray(obj) ? obj : obj && Array.isArray(obj.questions) ? obj.questions : [];
    return arr.map((x) => {
      const options = (x.options || x.choices || []).map((o) => String(o).trim()).slice(0, 4);
      while (options.length < 4) options.push("");
      let ans = Number(x.answer ?? x.correct ?? 0);
      if (typeof x.answer === "string" && isNaN(ans)) ans = options.indexOf(x.answer.trim());
      return { q: String(x.q || x.question || "").trim(), options, answer: ans >= 0 && ans < 4 ? ans : 0, time: Number(x.time) || Q.defaultTime || 20, explanation: String(x.explanation || "").trim() };

  }

              <span class="n">${counts[k]}</span>
              <div class="bar c${k}" style="height:${12 + (counts[k] / max) * 120}px"></div>
              <span class="sh c${k}">${SHAPES[k]}${k === q.answer ? " ✔" : ""}</span>
            </div>` : "").join("")}</div>
          <div class="qz-tiles">${q.options.map((o, k) => o ? `<div class="qz-tile c${k} ${k === q.answer ? "right" : "dim"}"><span class="sh">${SHAPES[k]}</span>${esc(o)}${k === q.answer ? " ✔" : ""}</div>` : "").join("")}</div>
          ${q.explanation ? `<div class="qz-exp">💡 ${esc(q.explanation)}</div>` : ""}
          <button class="btn qz-go" id="hNext">순위 보기 ▶</button>
        </div>`;
    } else if (g.phase === "board") {
      const r = ranking().slice(0, 5), last = g.qi === g.questions.length - 1;
      html = `${top}
        <div class="qz-board">
          <h2>🏆 현재 순위</h2>
          <ol class="qz-rank">${r.map((p, i) => `<li style="animation-delay:${i * 90}ms"><span class="rk">${i + 1}</span><b>${esc(p.name)}</b><span class="sc">${p.score.toLocaleString()}</span>${p.answers[g.qi] && p.answers[g.qi].correct ? `<span class="plus">+${p.answers[g.qi].pts}</span>` : ""}</li>`).join("") || "<li>참여자가 없습니다</li>"}</ol>
          <button class="btn qz-go" id="hNext">${last ? "최종 결과 🎉" : "다음 문제 ▶"}</button>
        </div>`;
    } else if (g.phase === "end") {
      const r = ranking();
      const pod = [r[1], r[0], r[2]];
      html = `${top}
        <div class="qz-board">
          <h2>🎉 최종 결과</h2>
          <div class="qz-podium">${pod.map((p, i) => p ? `<div class="pd p${[2, 1, 3][i]}"><b>${esc(p.name)}</b><span>${p.score.toLocaleString()}점</span><div class="blk">${[2, 1, 3][i]}</div></div>` : `<div class="pd empty"></div>`).join("")}</div>
          <div class="row-btns center">
            <button class="btn btn-primary sm" id="hCsv1">⬇ 퀴즈 결과 CSV</button>
            <button class="btn btn-ghost sm" id="hCsv2">⬇ 문항별 정답률 CSV</button>
            <button class="btn btn-ghost sm" id="hClose">닫기</button>
          </div>
          <details class="qz-all"><summary>전체 순위 (${r.length}명)</summary><ol>${r.map((p) => `<li>${esc(p.name)} — ${p.score.toLocaleString()}점 · ${Object.values(p.answers).filter((a) => a.correct).length}/${g.questions.length} 정답</li>`).join("")}</ol></details>
        </div>`;
    }
    layer.innerHTML = `<div class="qz-stage-in">${html}</div>`;
    $("#hQuit").onclick = hostQuit;
    const next = $("#hNext");
    if (next) next.onclick = () => {
      if (g.phase === "lobby") goQuestion(0);
      else if (g.phase === "question") toReveal();
      else if (g.phase === "reveal") toBoard();
      else if (g.phase === "board") g.qi === g.questions.length - 1 ? toEnd() : goQuestion(g.qi + 1);
    };
    $("#hDemo") && ($("#hDemo").onclick = () => window.open(joinURL(g.pin), "_blank"));
    $("#hCsv1") && ($("#hCsv1").onclick = () => downloadResults(g, "long"));
    $("#hCsv2") && ($("#hCsv2").onclick = () => downloadResults(g, "item"));
    $("#hClose") && ($("#hClose").onclick = hostQuit);
  }
  const playersHtml = () => Object.values(game.players).map((p) => `<span class="qz-chip">${esc(p.name)}</span>`).join("");

  /* ── 결과 CSV ── */
  function downloadResults(g, kind) {
    if (!g) return;
    const cell = (v) => { const s = v == null ? "" : String(v); return /[",\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
    const csv = (rows) => "﻿" + rows.map((r) => r.map(cell).join(",")).join("\r\n");
    const ranked = Object.entries(g.players).map(([pid, p]) => ({ pid, ...p })).sort((a, b) => b.score - a.score);
    const rankOf = Object.fromEntries(ranked.map((p, i) => [p.pid, i + 1]));
    const L = (k) => ["①", "②", "③", "④"][k] || "";
    let rows, name;
    const day = (g.endedAt || g.startedAt || new Date().toISOString()).slice(0, 10);
    if (kind === "item") {
      rows = [["문항", "문제", "정답", "응답 수", "정답 수", "정답률(%)", "평균 응답시간(초)", "①선택", "②선택", "③선택", "④선택"]];
      g.questions.forEach((q, i) => {
        const ans = ranked.map((p) => p.answers[i]).filter(Boolean);
        const right = ans.filter((a) => a.correct).length;
        rows.push([i + 1, q.q, `${L(q.answer)} ${q.options[q.answer]}`, ans.length, right, ranked.length ? Math.round((right / ranked.length) * 100) : 0,
          ans.length ? (ans.reduce((s, a) => s + a.ms, 0) / ans.length / 1000).toFixed(1) : "", ...[0, 1, 2, 3].map((k) => ans.filter((a) => a.choice === k).length)]);
      });
      name = `quiz-items_${g.pin}_${day}.csv`;
    } else {
      rows = [["순위", "닉네임", "학번", "총점", "정답 수", "문항", "문제", "선택", "정답 여부", "응답시간(초)", "획득 점수"]];
      ranked.forEach((p) => g.questions.forEach((q, i) => {
        const a = p.answers[i];
        rows.push([rankOf[p.pid], p.name, p.sid || "", p.score, Object.values(p.answers).filter((x) => x.correct).length, i + 1, q.q,
          a ? `${L(a.choice)} ${q.options[a.choice]}` : "미응답", a ? (a.correct ? "O" : "X") : "X", a ? (a.ms / 1000).toFixed(1) : "", a ? a.pts : 0]);
      }));
      name = `quiz-results_${g.pin}_${day}.csv`;
    }
    const el = document.createElement("a");
    el.href = URL.createObjectURL(new Blob([csv(rows)], { type: "text/csv;charset=utf-8" }));
    el.download = name; document.body.appendChild(el); el.click(); el.remove();
    setTimeout(() => URL.revokeObjectURL(el.href), 2000);
    toast(`${name} 파일을 내려받았습니다`);
  }

  /* =========================================================
   * 학생 화면
   * ========================================================= */
  let stuTimer = null, me = null, lastKey = "", resend = 0;
  const send = (msg) => { msg.seq = Date.now() + Math.random(); ls.set("quiz-msg:" + me.pid, msg); };

  function joinGame(pin, nick) {
    const m = $(".qz-msg", card);
    const g = ls.get("quiz-live", null);
    if (!/^\d{6}$/.test(pin)) { m.textContent = "PIN 6자리를 입력해 주세요."; return; }
    if (!nick) { m.textContent = "닉네임을 입력해 주세요."; $("#qzNick").focus(); return; }
    if (!g || g.pin !== pin || g.phase === "end" || g.phase === "closed") { m.textContent = "진행 중인 퀴즈를 찾을 수 없습니다. PIN을 확인해 주세요."; return; }
    m.textContent = "";
    const sess = ls.get("session", null);
    let pid = ss.get("quiz-pid"); if (!pid) { pid = rid(); ss.set("quiz-pid", pid); }
    me = { pid, pin, name: nick, sid: sess && sess.name === nick ? sess.id : "" };
    ss.set("quiz-me", JSON.stringify(me));
    send({ type: "join", pin, pid, name: nick, sid: me.sid });
    layer.hidden = false; layer.className = "qz-layer show stage student";
    document.body.classList.add("no-scroll");
    lastKey = ""; stuSync();
    clearInterval(stuTimer); stuTimer = setInterval(stuSync, 400);
  }
  function stuLeave() {
    if (me) { const g = ls.get("quiz-live", null); if (g && g.phase === "lobby") send({ type: "leave", pin: me.pin, pid: me.pid }); }
    ss.del("quiz-me"); me = null; closeLayer();
  }
  function stuSync() {
    if (!me || layer.hidden || !layer.classList.contains("student")) return;
    const g = ls.get("quiz-live", null);
    if (!g || g.pin !== me.pin || g.phase === "closed") { stuShow("closed", g); return; }
    const p = g.players[me.pid];
    // 입장·답안이 전달되지 않았으면 다시 보내기 (탭 간 메시지 유실 대비)
    if (!p && Date.now() - resend > 1000) { resend = Date.now(); send({ type: "join", pin: me.pin, pid: me.pid, name: me.name, sid: me.sid }); }
    if (p && g.phase === "question" && me.pending && me.pending.q === g.qi && !p.answers[g.qi] && Date.now() - resend > 800) { resend = Date.now(); send({ type: "answer", pin: me.pin, pid: me.pid, q: g.qi, choice: me.pending.choice }); }
    const key = `${g.phase}|${g.qi}|${p ? 1 : 0}|${p && p.answers[g.qi] ? 1 : 0}|${me.pending && me.pending.q === g.qi ? 1 : 0}`;
    if (g.phase === "question") { const t = $(".st-timer", layer); if (t) t.textContent = Math.max(0, Math.ceil(g.questions[g.qi].time - (Date.now() - g.qStart) / 1000)); }
    if (key === lastKey) return;
    lastKey = key;
    stuShow(g.phase, g, p);
  }
  function stuShow(phase, g, p) {
    const head = `<div class="qz-top"><span class="qz-tag">🎮 ${esc(g ? g.title : "퀴즈")}</span><span class="qz-tag">${esc(me ? (p ? p.name : me.name) : "")}</span>${p ? `<span class="qz-tag">${p.score.toLocaleString()}점</span>` : ""}<button class="qz-x" id="sLeave">✕ 나가기</button></div>`;
    const rank = () => { if (!g || !p) return ""; const r = Object.entries(g.players).sort((a, b) => b[1].score - a[1].score).findIndex(([id]) => id === me.pid) + 1; return `${r}등 / ${Object.keys(g.players).length}명`; };
    let html = "";
    if (phase === "closed") html = `<div class="st-center"><div class="st-big">👋</div><h2>퀴즈가 종료되었습니다</h2><p>교수자가 퀴즈를 닫았어요.</p><button class="btn btn-primary" id="sDone">돌아가기</button></div>`;
    else if (!p) html = `<div class="st-center"><div class="st-big spin">⏳</div><h2>입장하는 중…</h2><p>교수자 화면이 열려 있는지 확인해 주세요.</p></div>`;
    else if (phase === "lobby") html = `<div class="st-center"><div class="st-big pop">🙌</div><h2>입장 완료!</h2><p>화면에 <b>${esc(p.name)}</b> 이름이 보이나요?<br>곧 퀴즈가 시작됩니다.</p></div>`;
    else if (phase === "question") {
      const q = g.questions[g.qi];
      if (p.answers[g.qi] || (me.pending && me.pending.q === g.qi)) html = `<div class="st-center"><div class="st-big pop">📨</div><h2>답안 제출!</h2><p>다른 친구들을 기다리는 중…</p></div>`;
      else html = `<div class="st-q"><div class="st-qhead"><span>문제 ${g.qi + 1}/${g.questions.length}</span><span class="st-timer">${Math.max(0, Math.ceil(q.time - (Date.now() - g.qStart) / 1000))}</span></div>
          <p class="st-qtext">${esc(q.q)}</p>
          <div class="st-tiles">${q.options.map((o, k) => o ? `<button class="qz-tile c${k}" data-k="${k}"><span class="sh">${SHAPES[k]}</span>${esc(o)}</button>` : "").join("")}</div></div>`;
    } else if (phase === "reveal" || phase === "board") {
      const a = p.answers[g.qi], q = g.questions[g.qi];
      html = a && a.correct
        ? `<div class="st-center st-right"><div class="st-big pop">🎉</div><h2>정답!</h2><p class="st-pts">+${a.pts}</p><p>${rank()}</p></div>`
        : `<div class="st-center st-wrong"><div class="st-big pop">${a ? "😢" : "⌛"}</div><h2>${a ? "아쉬워요" : "시간 초과"}</h2><p>정답: ${SHAPES[q.answer]} ${esc(q.options[q.answer])}</p><p>${rank()}</p></div>`;
    } else if (phase === "end") {
      const r = Object.entries(g.players).sort((a, b) => b[1].score - a[1].score).findIndex(([id]) => id === me.pid) + 1;
      html = `<div class="st-center"><div class="st-big pop">${["🥇", "🥈", "🥉"][r - 1] || "🏁"}</div><h2>${r}등!</h2><p class="st-pts">${p.score.toLocaleString()}점</p><p>${Object.values(p.answers).filter((x) => x.correct).length} / ${g.questions.length} 정답</p><button class="btn btn-primary" id="sDone">끝내기</button></div>`;
      if (r <= 3 && U.fireConfetti) U.fireConfetti();
    }
    layer.innerHTML = `<div class="qz-stage-in">${head}${html}</div>`;
    $("#sLeave").onclick = stuLeave;
    $("#sDone") && ($("#sDone").onclick = stuLeave);
    $$(".st-tiles .qz-tile", layer).forEach((b) => (b.onclick = () => {
      me.pending = { q: g.qi, choice: Number(b.dataset.k) };
      send({ type: "answer", pin: me.pin, pid: me.pid, q: g.qi, choice: me.pending.choice });
      resend = Date.now(); lastKey = ""; stuSync();
    }));
  }

  /* ── QR(?quiz=PIN)로 들어온 경우: 바로 입장 화면 ── */
  const qp = new URLSearchParams(location.search).get("quiz");
  if (qp) {
    setTimeout(() => {
      card.scrollIntoView({ block: "center" });
      $("#qzPin").value = qp;
      const saved = ss.get("quiz-me");
      if (saved) { const s = JSON.parse(saved); if (s.pin === qp) { joinGame(qp, s.name); return; } }
      $("#qzNick").focus();
      card.classList.add("flash"); setTimeout(() => card.classList.remove("flash"), 1600);
    }, 400);
  }
})();
</script>
</body>
</html>
