<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>재무회계 | 고려대학교 경영학과</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700;900&family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
  <style>
:root {
  --pink-50: #fff5f8;
  --pink-100: #ffe4ee;
  --pink-200: #fbcfe0;
  --pink-400: #f18cb5;
  --pink-500: #e46a9c;
  --purple-100: #efe7fb;
  --purple-300: #c4a8ee;
  --purple-500: #9a6fd6;
  --purple-700: #6b46a8;
  --ink: #3b2a4a;
  --ink-soft: #6e5f7c;
  --card: #ffffffcc;
  --line: #f1dbe8;
  --radius: 24px;
  --shadow: 0 10px 30px -12px rgba(154, 111, 214, 0.28);
  --header-h: 68px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; scroll-padding-top: calc(var(--header-h) + 12px); }
body {
  font-family: "Pretendard", "Noto Sans KR", -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  color: var(--ink);
  line-height: 1.65;
  word-break: keep-all;
  background:
    radial-gradient(circle at 10% 0%, var(--pink-100) 0, transparent 40%),
    radial-gradient(circle at 90% 20%, var(--purple-100) 0, transparent 45%),
    linear-gradient(180deg, var(--pink-50), #fbf7ff 60%, var(--pink-50));
  background-attachment: fixed;
  min-height: 100vh;
  overflow-x: hidden;
}
a { color: inherit; text-decoration: none; }
button { font: inherit; cursor: pointer; border: 0; background: none; color: inherit; }

/* ── 벚꽃잎 장식 ── */
.petals { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
.petal {
  position: absolute; top: -20px; width: 12px; height: 10px;
  background: linear-gradient(135deg, #ffd3e2, #f7a6c4);
  border-radius: 12px 0 12px 0; opacity: .7;
  animation: fall linear infinite;
}
@keyframes fall {
  to { transform: translate(80px, 105vh) rotate(540deg); }
}
@media (prefers-reduced-motion: reduce) { .petal { display: none; } html { scroll-behavior: auto; } }

/* ── 헤더 ── */
.header {
  position: sticky; top: 0; z-index: 50; height: var(--header-h);
  background: rgba(255, 247, 251, .8);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid transparent;
  transition: border-color .3s, box-shadow .3s;
}
.header.scrolled { border-color: var(--line); box-shadow: 0 6px 20px -14px rgba(107, 70, 168, .35); }
.header-inner {
  max-width: 1120px; margin: 0 auto; height: 100%;
  display: flex; align-items: center; justify-content: space-between; padding: 0 20px;
}
.brand { display: flex; align-items: center; gap: 10px; font-weight: 800; }
.brand-mark {
  width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center;
  background: linear-gradient(135deg, var(--pink-400), var(--purple-500)); color: #fff; font-size: 18px;
}
.brand small { display: block; font-size: 11px; font-weight: 500; color: var(--ink-soft); line-height: 1.2; }
.brand span { line-height: 1.2; }
.nav { display: flex; gap: 4px; }
.nav a {
  padding: 8px 14px; border-radius: 999px; font-size: 15px; font-weight: 600; color: var(--ink-soft);
  transition: background .2s, color .2s;
}
.nav a:hover { background: var(--pink-100); color: var(--ink); }
.nav a.active { background: linear-gradient(135deg, var(--pink-200), var(--purple-100)); color: var(--purple-700); }
.menu-btn { display: none; width: 42px; height: 42px; border-radius: 12px; font-size: 22px; }
.menu-btn:hover { background: var(--pink-100); }

/* ── 공통 섹션 ── */
main { position: relative; z-index: 1; }
.section { max-width: 1120px; margin: 0 auto; padding: 72px 20px; }
.section-head { text-align: center; margin-bottom: 40px; }
.eyebrow {
  display: inline-block; font-size: 12px; letter-spacing: .18em; font-weight: 700;
  color: var(--purple-500); background: var(--purple-100); padding: 6px 14px; border-radius: 999px;
}
.section-head h2 { font-size: clamp(26px, 4vw, 36px); margin: 14px 0 10px; letter-spacing: -.02em; }
.section-head p { color: var(--ink-soft); max-width: 640px; margin: 0 auto; }

.card {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 28px;
  backdrop-filter: blur(6px);
  transition: transform .25s, box-shadow .25s;
}
.card:hover { transform: translateY(-4px); box-shadow: 0 18px 36px -14px rgba(154, 111, 214, .38); }
.grid { display: grid; gap: 20px; }
.grid-4 { grid-template-columns: repeat(4, 1fr); }
.grid-2 { grid-template-columns: repeat(2, 1fr); }

/* ── 히어로 ── */
.hero { padding-top: 64px; padding-bottom: 40px; }
.hero-card {
  border-radius: 36px; padding: 64px 48px; text-align: center; position: relative; overflow: hidden;
  background: linear-gradient(135deg, #ffe9f1 0%, #f6e8ff 55%, #ece3ff 100%);
  border: 1px solid #fff; box-shadow: var(--shadow);
}
.hero-card::before, .hero-card::after {
  content: ""; position: absolute; border-radius: 50%; filter: blur(10px); opacity: .55;
}
.hero-card::before { width: 260px; height: 260px; background: var(--pink-200); top: -80px; left: -60px; }
.hero-card::after { width: 300px; height: 300px; background: var(--purple-300); bottom: -140px; right: -80px; opacity: .35; }
.hero-card::before, .hero-card::after { pointer-events: none; z-index: 0; }
.hero-card > * { position: relative; z-index: 1; }
.badge {
  display: inline-block; background: #fff; color: var(--pink-500); font-weight: 700; font-size: 14px;
  padding: 7px 16px; border-radius: 999px; box-shadow: 0 4px 14px -6px rgba(228, 106, 156, .5);
}
.hero h1 {
  font-size: clamp(32px, 6vw, 56px); line-height: 1.25; margin: 22px 0 18px; letter-spacing: -.03em;
  white-space: pre-line;
  background: linear-gradient(135deg, #c2477e, var(--purple-700));
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.hero h1 { font-size: clamp(44px, 8vw, 76px); margin: 20px 0 6px; }
.hero-sub { font-size: clamp(19px, 2.6vw, 26px); font-weight: 700; color: var(--purple-700); margin-bottom: 18px; }
.hero-desc { font-size: clamp(15px, 1.9vw, 17px); color: var(--ink-soft); max-width: 660px; margin: 0 auto; }
.quick-info { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-top: 18px; }
.quick {
  display: flex; gap: 12px; align-items: center; padding: 16px 18px; border-radius: 20px;
  background: rgba(255,255,255,.85); border: 1px solid var(--line); box-shadow: var(--shadow);
}
.quick .ic { font-size: 22px; width: 44px; height: 44px; flex-shrink: 0; display: grid; place-items: center; border-radius: 14px; background: linear-gradient(135deg, var(--pink-100), var(--purple-100)); }
.quick small { display: block; font-size: 12px; color: var(--purple-500); font-weight: 700; }
.quick b { font-size: 14.5px; line-height: 1.4; display: block; }

/* ── 통계 카드 ── */
.stats-section { padding-top: 24px; }
.stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }
.stat-card { text-align: center; padding: 30px 18px; }
.stat-icon { font-size: 28px; }
.stat-num { margin: 8px 0 4px; font-weight: 800; font-size: clamp(38px, 5vw, 50px); line-height: 1.1;
  background: linear-gradient(135deg, var(--pink-500), var(--purple-700)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.stat-num em { font-style: normal; font-size: .45em; margin-left: 2px; }
.stat-label { color: var(--ink-soft); font-size: 14.5px; font-weight: 600; }

/* ── 장점 슬라이드 ── */
.slider { position: relative; }
.slide-track {
  display: grid; grid-auto-flow: column; grid-auto-columns: calc((100% - 40px) / 3); column-gap: 20px;
  overflow-x: auto; scroll-snap-type: x mandatory; scroll-behavior: smooth; padding: 8px 4px 24px; scroll-padding-inline: 4px;
  scrollbar-width: none; outline: none;
}
.slide-track::-webkit-scrollbar { display: none; }
.slide { scroll-snap-align: start; position: relative; padding: 34px 28px; min-height: 250px; }
.slide:hover { transform: none; }
.slide-no { position: absolute; top: 20px; right: 24px; font-weight: 800; font-size: 34px; color: var(--pink-100); }
.slide-icon { width: 60px; height: 60px; border-radius: 20px; display: grid; place-items: center; font-size: 30px;
  background: linear-gradient(135deg, var(--pink-200), var(--purple-100)); margin-bottom: 18px; }
.slide h3 { font-size: 20px; margin-bottom: 10px; }
.slide p { color: var(--ink-soft); }
.slide-btn {
  position: absolute; top: calc(50% - 30px); transform: translateY(-50%); z-index: 2;
  width: 46px; height: 46px; border-radius: 50%; background: #fff; color: var(--purple-700); font-size: 28px; line-height: 1;
  box-shadow: var(--shadow); border: 1px solid var(--line); display: grid; place-items: center; padding-bottom: 4px;
}
.slide-btn:hover { background: var(--pink-100); }
.slide-btn.prev { left: -18px; }
.slide-btn.next { right: -18px; }
.dots { display: flex; justify-content: center; gap: 8px; }
.dot { width: 9px; height: 9px; border-radius: 999px; background: var(--purple-100); transition: width .3s, background .3s; }
.dot.on { width: 28px; background: linear-gradient(90deg, var(--pink-400), var(--purple-500)); }

/* ── AI 도구 ── */
.tool-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
.tool { display: flex; gap: 16px; align-items: center; padding: 22px; }
.tool-icon { width: 56px; height: 56px; flex-shrink: 0; border-radius: 18px; display: grid; place-items: center; font-size: 28px;
  background: linear-gradient(135deg, var(--purple-100), var(--pink-100)); }
.tool h3 { font-size: 17px; }
.tool p { font-size: 14px; color: var(--ink-soft); }

/* ── 수강 안내 + 준비물 ── */
.guide-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.prep-list { display: grid; gap: 12px; }
.prep { display: flex; gap: 14px; align-items: flex-start; padding: 14px; border-radius: 16px; background: var(--pink-50); }
.prep .ic { font-size: 22px; width: 44px; height: 44px; flex-shrink: 0; display: grid; place-items: center; background: #fff; border-radius: 14px; }
.prep b { font-size: 15px; }
.prep p { font-size: 14px; color: var(--ink-soft); }
.hero-actions { display: flex; gap: 12px; justify-content: center; margin-top: 30px; flex-wrap: wrap; }
.btn {
  display: inline-flex; align-items: center; gap: 6px; padding: 14px 26px; border-radius: 999px;
  font-weight: 700; transition: transform .2s, box-shadow .2s;
}
.btn:hover { transform: translateY(-2px); }
.btn-primary { background: linear-gradient(135deg, var(--pink-500), var(--purple-500)); color: #fff; box-shadow: 0 10px 22px -10px rgba(154, 111, 214, .8); }
.btn-ghost { background: #fff; color: var(--purple-700); border: 1px solid var(--purple-100); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; max-width: 560px; margin: 40px auto 0; }
.stat { background: rgba(255, 255, 255, .75); border-radius: 20px; padding: 16px 10px; }
.stat b { display: block; font-size: 24px; color: var(--purple-700); }
.stat span { font-size: 13px; color: var(--ink-soft); }

/* ── 소개 카드 ── */
.feature .icon {
  width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; font-size: 26px;
  background: linear-gradient(135deg, var(--pink-100), var(--purple-100)); margin-bottom: 16px;
}
.feature h3 { font-size: 18px; margin-bottom: 8px; }
.feature p { color: var(--ink-soft); font-size: 15px; }

/* ── 커리큘럼 ── */
.weeks { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.week { padding: 22px; display: flex; gap: 16px; align-items: flex-start; }
.week-num {
  flex-shrink: 0; width: 54px; height: 54px; border-radius: 18px; display: grid; place-items: center;
  font-weight: 800; color: #fff; background: linear-gradient(135deg, var(--pink-400), var(--purple-500));
  font-size: 13px; line-height: 1.1; text-align: center;
}
.week-num b { display: block; font-size: 20px; }
.week h3 { font-size: 16px; margin-bottom: 4px; }
.week p { font-size: 14px; color: var(--ink-soft); }
.week.exam .week-num { background: linear-gradient(135deg, #f5b8cf, #c9b3ee); }
.week.exam { background: linear-gradient(135deg, #fff0f6, #f6f0ff); }

/* ── 수강 안내 ── */
.info-list { display: grid; gap: 14px; }
.info-item { display: flex; gap: 14px; align-items: center; padding: 14px; border-radius: 16px; background: var(--pink-50); }
.info-item .ic { font-size: 22px; width: 44px; height: 44px; display: grid; place-items: center; background: #fff; border-radius: 14px; flex-shrink: 0; }
.info-item small { display: block; color: var(--ink-soft); font-size: 13px; }
.info-item b { font-size: 15px; }
.card h3.card-title { font-size: 18px; margin-bottom: 18px; }
.bar { margin-bottom: 16px; }
.bar-top { display: flex; justify-content: space-between; font-size: 15px; margin-bottom: 6px; }
.bar-top b { color: var(--purple-700); }
.bar-track { height: 12px; background: var(--purple-100); border-radius: 999px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--pink-400), var(--purple-500)); width: 0; transition: width 1.2s ease; }
.notes { margin-top: 20px; padding-top: 18px; border-top: 1px dashed var(--line); list-style: none; }
.notes li { position: relative; padding-left: 22px; font-size: 14px; color: var(--ink-soft); margin-bottom: 6px; }
.notes li::before { content: "🌸"; position: absolute; left: 0; font-size: 12px; top: 2px; }

/* ── FAQ ── */
.faq-list { max-width: 800px; margin: 0 auto; display: grid; gap: 14px; }
.faq-item { padding: 0; overflow: hidden; }
.faq-item:hover { transform: none; }
.faq-q {
  width: 100%; text-align: left; padding: 20px 24px; display: flex; justify-content: space-between; align-items: center; gap: 16px;
  font-weight: 700; font-size: 16px;
}
.faq-q .q-mark { color: var(--pink-500); margin-right: 8px; }
.faq-q .chev {
  width: 30px; height: 30px; border-radius: 50%; background: var(--purple-100); color: var(--purple-700);
  display: grid; place-items: center; flex-shrink: 0; transition: transform .3s;
}
.faq-item.open .chev { transform: rotate(45deg); background: var(--pink-200); }
.faq-a { max-height: 0; overflow: hidden; transition: max-height .35s ease; }
.faq-a p { padding: 0 24px 22px 50px; color: var(--ink-soft); }


/* ── 커리큘럼 아코디언 ── */
.acc-tools { display: flex; justify-content: space-between; align-items: center; max-width: 900px; margin: 0 auto 14px; color: var(--ink-soft); font-size: 14px; }
.acc-toggle-all { background: #fff; border: 1px solid var(--line); padding: 8px 16px; border-radius: 999px; font-weight: 700; color: var(--purple-700); font-size: 14px; }
.acc-toggle-all:hover { background: var(--pink-100); }
.acc-list { max-width: 900px; margin: 0 auto; display: grid; gap: 12px; }
.acc { padding: 0; overflow: hidden; }
.acc:hover { transform: none; }
.acc.exam { background: linear-gradient(135deg, #fff0f6, #f6f0ff); }
.acc.exam .week-num { background: linear-gradient(135deg, #f5b8cf, #c9b3ee); }
.acc.flash { box-shadow: 0 0 0 3px var(--pink-400), var(--shadow); }
.acc-head { width: 100%; display: flex; align-items: center; gap: 16px; padding: 18px 22px; text-align: left; }
.acc-head .week-num { flex-shrink: 0; width: 54px; height: 54px; border-radius: 18px; display: grid; place-items: center; font-weight: 800; color: #fff;
  background: linear-gradient(135deg, var(--pink-400), var(--purple-500)); font-size: 12px; line-height: 1.1; text-align: center; }
.acc-head .week-num b { display: block; font-size: 20px; }
.acc-title { flex: 1; min-width: 0; }
.acc-date { font-size: 12.5px; font-weight: 700; color: var(--pink-500); }
.acc-title h3 { font-size: 17px; line-height: 1.35; }
.acc-title p { font-size: 13.5px; color: var(--ink-soft); }
.acc-badges { display: flex; gap: 6px; flex-shrink: 0; }
.pill { font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px; }
.hw-pill { background: var(--pink-100); color: #b54a7d; }
.exam-pill { background: var(--purple-100); color: var(--purple-700); }
.acc .chev { width: 32px; height: 32px; border-radius: 50%; background: var(--purple-100); color: var(--purple-700); display: grid; place-items: center; flex-shrink: 0; font-size: 18px; transition: transform .3s; }
.acc.open .chev { transform: rotate(45deg); background: var(--pink-200); }
.acc-body { max-height: 0; overflow: hidden; transition: max-height .4s ease; }
.acc-inner { padding: 4px 22px 24px; border-top: 1px dashed var(--line); margin: 0 22px; padding-left: 0; padding-right: 0; }
.meta { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 18px 0; }
.meta > div { background: var(--pink-50); border-radius: 16px; padding: 12px 14px; display: grid; grid-template-columns: auto 1fr; column-gap: 10px; align-items: center; }
.meta span { grid-row: span 2; font-size: 20px; }
.meta small { font-size: 12px; color: var(--ink-soft); }
.meta b { font-size: 14.5px; }
.acc-cols { display: grid; grid-template-columns: 1.2fr 1fr; gap: 20px; }
.acc h4 { font-size: 14px; color: var(--purple-500); margin-bottom: 8px; }
.topics { list-style: none; display: grid; gap: 6px; }
.topics li { position: relative; padding-left: 20px; font-size: 14.5px; }
.topics li::before { content: ""; position: absolute; left: 4px; top: 9px; width: 7px; height: 7px; border-radius: 50%; background: var(--pink-400); }
.videos { display: grid; gap: 8px; }
.video { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 14px; background: var(--purple-100); font-size: 14px; font-weight: 600; color: var(--purple-700); transition: background .2s; }
.video:hover { background: var(--pink-100); }
.video span { width: 26px; height: 26px; border-radius: 50%; background: #fff; display: grid; place-items: center; font-size: 11px; color: var(--pink-500); flex-shrink: 0; }
.muted { color: var(--ink-soft); font-size: 14px; }
.assign { margin-top: 20px; border-radius: 20px; padding: 20px; background: linear-gradient(135deg, #fff1f6, #f4edff); border: 1px solid var(--pink-200); }
.assign-head { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 6px; }
.assign-tag { background: var(--pink-500); color: #fff; font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px; }
.assign p { font-size: 14.5px; color: var(--ink-soft); }
.assign-foot { display: flex; justify-content: space-between; align-items: flex-end; gap: 14px; margin-top: 14px; flex-wrap: wrap; }
.assign-foot small { font-size: 12px; color: var(--ink-soft); }
.due { font-weight: 700; }
.countdown { display: inline-block; margin-top: 6px; font-size: 13px; font-weight: 700; padding: 4px 12px; border-radius: 999px; }
.countdown.ok { background: #e9f8ef; color: #2f8a57; }
.countdown.soon { background: #fff4e0; color: #b7791f; }
.countdown.urgent { background: #ffe3e3; color: #d6336c; animation: pulse 1.6s infinite; }
.countdown.over { background: #eee9f3; color: #8a7c98; }
@keyframes pulse { 50% { opacity: .55; } }
.submit-btn { padding: 12px 22px; }

.toast { position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 20px); z-index: 80; background: var(--ink); color: #fff;
  padding: 12px 20px; border-radius: 999px; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .3s, transform .3s; max-width: calc(100% - 32px); text-align: center; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ── 달력 ── */
.cal-wrap { display: grid; grid-template-columns: 1.4fr 1fr; gap: 20px; align-items: start; }
.cal:hover, .cal-detail:hover { transform: none; }
.cal-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
.cal-month { font-size: 20px; }
.cal-nav { width: 40px; height: 40px; border-radius: 50%; background: var(--purple-100); color: var(--purple-700); font-size: 24px; display: grid; place-items: center; padding-bottom: 3px; }
.cal-nav:hover { background: var(--pink-200); }
.cal-week, .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.cal-week span { text-align: center; font-size: 13px; font-weight: 700; color: var(--ink-soft); padding-bottom: 6px; }
.cal-week span:first-child { color: #e0607e; }
.cal-week span:last-child { color: #6f7fd6; }
.day { position: relative; aspect-ratio: 1 / 1; border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  font-size: 14px; transition: background .2s; min-height: 0; }
.day:hover { background: var(--pink-50); }
.day.sun .dn { color: #e0607e; }
.day.sat .dn { color: #6f7fd6; }
.day.other { opacity: .35; }

/* 편집기 */
.editor { display: grid; gap: 14px; }
.ed-obj { border: 1px solid var(--line); border-radius: 18px; padding: 14px 16px 16px; background: #fff; display: grid; gap: 10px; min-width: 0; }
.ed-obj .ed-obj { background: #fdf9fc; }
.ed-obj legend { font-weight: 800; font-size: 14px; color: var(--purple-700); padding: 0 6px; }
.ed-row { display: grid; gap: 4px; }
.ed-row > label { font-size: 12.5px; font-weight: 700; color: var(--ink-soft); }
.ed-bool { display: flex; gap: 8px; align-items: center; font-size: 14px; font-weight: 600; cursor: pointer; }
.ed-bool input { width: 18px; height: 18px; accent-color: var(--pink-500); }
.ed-item { border: 1px solid var(--line); border-radius: 14px; background: #fff; }
.ed-item[open] { box-shadow: 0 6px 16px -10px rgba(154, 111, 214, .5); }
.ed-item summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px; padding: 10px 12px; font-size: 14px; font-weight: 700; }
.ed-item summary::-webkit-details-marker { display: none; }
.ed-item summary::before { content: "▸"; color: var(--purple-500); transition: transform .2s; }
.ed-item[open] summary::before { transform: rotate(90deg); }
.ed-sum { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ed-item-body { padding: 4px 14px 14px; display: grid; gap: 10px; }
.ed-prim { display: flex; gap: 6px; align-items: center; }
.ed-ctrl { display: inline-flex; gap: 4px; flex-shrink: 0; }
.ed-ctrl button { width: 28px; height: 28px; border-radius: 8px; background: var(--purple-100); color: var(--purple-700); font-size: 13px; font-weight: 700; }
.ed-ctrl button:disabled { opacity: .3; }
.ed-ctrl button.x { background: #ffe8ee; color: #d6336c; }
.ed-opts { display: flex; flex-wrap: wrap; gap: 6px; }
.chip-btn { justify-self: start; padding: 6px 12px; border-radius: 999px; border: 1.5px dashed var(--purple-300); color: var(--purple-700); font-size: 13px; font-weight: 700; background: #fff; }
.chip-btn:hover { background: var(--purple-100); }
.chip-btn.del { border-color: #f3a5bf; color: #d6336c; }
.chip-btn.add { border-style: solid; }


/* ── 실시간 퀴즈 ── */
.qz-card { margin-top: 20px; }
.qz-card.flash { box-shadow: 0 0 0 3px var(--pink-400), var(--shadow); }
.qz-grid { display: grid; grid-template-columns: 1fr 1.3fr; gap: 16px; margin-bottom: 12px; }
.qz-join input, .qz-select, .qz-ai select, .qz-sheet input:not([type=radio]):not([type=checkbox]), .qz-sheet textarea, .qz-sheet select {
  width: 100%; font: inherit; font-size: 15px; padding: 11px 14px; border-radius: 14px; border: 1.5px solid var(--line); background: #fff; color: var(--ink); outline: none; }
.qz-join input:focus, .qz-sheet input:focus, .qz-sheet textarea:focus { border-color: var(--purple-300); box-shadow: 0 0 0 3px var(--purple-100); }
.qz-pin-input { text-align: center; font-size: 22px !important; font-weight: 800; letter-spacing: .3em; }
.qz-hist { display: grid; gap: 6px; font-size: 14px; border-top: 1px dashed var(--line); padding-top: 10px; }
.qz-hist-row { display: flex; justify-content: space-between; gap: 10px; align-items: center; }
.qz-hist-row small { color: var(--ink-soft); }
.c0 { --c: #e2557f; } .c1 { --c: #7b5cd6; } .c2 { --c: #f0a73a; } .c3 { --c: #26a98f; }

.qz-layer { position: fixed; inset: 0; z-index: 110; opacity: 0; transition: opacity .25s; }
.qz-layer[hidden] { display: none; }
.qz-layer.show { opacity: 1; }
.qz-layer.sheet { background: rgba(59, 42, 74, .45); backdrop-filter: blur(6px); padding: 16px; }
.qz-layer.stage { background: radial-gradient(circle at 15% 10%, #8f5bd0 0, transparent 45%), radial-gradient(circle at 85% 90%, #e2557f 0, transparent 45%), linear-gradient(135deg, #3d2266, #5a3d86 50%, #8a3f7a); color: #fff; overflow-y: auto; }

/* 편집기 */
.qz-sheet { max-width: 920px; height: 100%; margin: 0 auto; background: #fdfbff; border-radius: 28px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 30px 80px -20px rgba(0,0,0,.4); }
.qz-sheet-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 16px 22px; border-bottom: 1px solid var(--line); background: #fff; flex-wrap: wrap; }
.qz-sheet-top h2 { font-size: 20px; }
.qz-sheet-body { flex: 1; overflow-y: auto; padding: 20px 22px 40px; display: grid; gap: 14px; align-content: start; }
.qz-ai { border: 1.5px solid var(--purple-300); border-radius: 20px; background: linear-gradient(135deg, #f8f2ff, #fff4f8); }
.qz-ai summary { cursor: pointer; padding: 14px 18px; font-weight: 800; color: var(--purple-700); list-style: none; }
.qz-ai summary::-webkit-details-marker { display: none; }
.qz-ai-body { padding: 0 18px 18px; display: grid; gap: 14px; }
.qz-ai-way { background: #fff; border-radius: 16px; padding: 14px; display: grid; gap: 10px; font-size: 14px; border: 1px solid var(--line); }
.ai-msg { font-size: 14px; font-weight: 600; }
.ai-msg.bad { color: #d6336c; } .ai-msg.ok { color: #2f8a57; }
.qz-qs { display: grid; gap: 12px; }
.qz-q { background: #fff; border: 1px solid var(--line); border-radius: 18px; padding: 14px; display: grid; gap: 8px; }
.qz-q-head { display: flex; align-items: center; gap: 10px; }
.qz-q-head b { color: var(--purple-700); }
.qz-q-head select { width: auto !important; padding: 6px 10px !important; font-size: 13.5px !important; }
.qz-q-head .ed-ctrl { margin-left: auto; }
.qz-opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.qz-opt { display: flex; align-items: center; gap: 8px; border-radius: 14px; padding: 4px 8px 4px 6px; background: color-mix(in srgb, var(--c) 10%, #fff); border: 1.5px solid color-mix(in srgb, var(--c) 30%, #fff); }
.qz-opt:has(input[type=radio]:checked) { border-color: var(--c); box-shadow: 0 0 0 2px color-mix(in srgb, var(--c) 35%, transparent); }
.qz-opt input[type=radio] { width: 18px; height: 18px; accent-color: var(--c); flex-shrink: 0; }
.qz-opt .sh { color: var(--c); font-size: 15px; }
.qz-opt input:not([type=radio]) { border: 0 !important; background: transparent !important; box-shadow: none !important; padding: 8px 4px !important; }
.danger-zone { border-top: 1px dashed var(--line); padding-top: 12px; }

/* 진행 화면 (교수자·학생 공통) */
.qz-stage-in { min-height: 100%; display: flex; flex-direction: column; padding: 16px 20px 28px; max-width: 1200px; margin: 0 auto; }
.qz-top { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.qz-tag { background: rgba(255,255,255,.16); border-radius: 999px; padding: 6px 14px; font-size: 14px; font-weight: 700; }
.qz-x { margin-left: auto; background: rgba(255,255,255,.18); color: #fff; padding: 7px 14px; border-radius: 999px; font-weight: 700; font-size: 14px; }
.qz-x:hover { background: rgba(255,255,255,.3); }
.qz-go { align-self: center; margin-top: 22px; background: #fff; color: #5a3d86; font-size: 18px; padding: 15px 36px; box-shadow: 0 10px 30px -10px rgba(0,0,0,.5); }
.qz-go:disabled { opacity: .5; }
.qz-lobby { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 18px; padding-top: 18px; }
.qz-join-box { display: flex; gap: 28px; align-items: center; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.2); border-radius: 28px; padding: 22px 28px; flex-wrap: wrap; justify-content: center; }
.qz-qr { background: #fff; border-radius: 18px; padding: 10px; line-height: 0; }
.qz-qr img { width: 210px; height: 210px; image-rendering: pixelated; }
.qz-join-box p { font-size: 15px; opacity: .92; }
.qz-bigpin { font-size: clamp(48px, 8vw, 84px); font-weight: 900; letter-spacing: .08em; line-height: 1.1; margin: 6px 0; text-shadow: 0 6px 24px rgba(0,0,0,.25); }
.qz-small { font-size: 12.5px !important; opacity: .75 !important; max-width: 340px; margin: 6px 0 10px; }
.qz-join-box .btn-ghost { background: rgba(255,255,255,.95); }
.qz-waiting { display: flex; gap: 14px; align-items: center; font-weight: 700; }
.qz-count { background: #fff; color: #5a3d86; border-radius: 999px; padding: 6px 16px; }
.qz-dots::after { content: ""; animation: dots 1.4s infinite steps(4); }
@keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
.qz-players { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; max-width: 900px; }
.qz-chip { background: #fff; color: var(--ink); font-weight: 800; padding: 10px 18px; border-radius: 14px; animation: popIn .35s cubic-bezier(.2,1.4,.4,1); box-shadow: 0 6px 16px -8px rgba(0,0,0,.5); }
@keyframes popIn { from { transform: scale(.3); opacity: 0; } }
.qz-question { flex: 1; display: flex; flex-direction: column; gap: 16px; padding-top: 14px; }
.qz-qbar { display: flex; justify-content: space-between; font-weight: 700; opacity: .85; }
.qz-qtext { background: #fff; color: var(--ink); border-radius: 22px; padding: 22px 26px; text-align: center; font-size: clamp(20px, 3.2vw, 34px); line-height: 1.4; box-shadow: 0 14px 30px -14px rgba(0,0,0,.5); }
.qz-mid { display: flex; justify-content: space-between; align-items: center; padding: 0 10px; }
.qz-timer { --p: 1; width: 96px; height: 96px; border-radius: 50%; display: grid; place-items: center; background: conic-gradient(#fff calc(var(--p) * 360deg), rgba(255,255,255,.18) 0); }
.qz-timer b { width: 78px; height: 78px; border-radius: 50%; background: #5a3d86; display: grid; place-items: center; font-size: 32px; }
.qz-answered { text-align: center; }
.qz-answered b { display: block; font-size: 40px; line-height: 1; }
.qz-tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.qz-tile { display: flex; align-items: center; gap: 14px; background: var(--c); color: #fff; border-radius: 18px; padding: 20px 22px; font-size: clamp(16px, 2.2vw, 24px); font-weight: 800; text-align: left; box-shadow: inset 0 -5px 0 rgba(0,0,0,.18); transition: opacity .3s, transform .15s; }
.qz-tile .sh { font-size: 1.2em; opacity: .9; }
.qz-tile.dim { opacity: .3; }
.qz-tile.right { outline: 4px solid #fff; }
button.qz-tile:active { transform: scale(.97); }
.qz-skip { align-self: center; background: rgba(255,255,255,.18) !important; color: #fff !important; border: 0 !important; }
.qz-dist { display: flex; justify-content: center; align-items: flex-end; gap: 22px; min-height: 170px; }
.qz-col { display: grid; justify-items: center; gap: 6px; }
.qz-col .bar { width: 64px; border-radius: 10px 10px 4px 4px; background: var(--c); transition: height .6s cubic-bezier(.2,.8,.2,1); }
.qz-col.wrong .bar { opacity: .4; }
.qz-col .n { font-weight: 800; font-size: 20px; }
.qz-col .sh { font-weight: 800; background: #fff; color: var(--c); border-radius: 999px; padding: 2px 12px; }
.qz-exp { background: rgba(255,255,255,.14); border-radius: 16px; padding: 12px 16px; font-size: 16px; }
.qz-board { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 18px; padding-top: 20px; }
.qz-board h2 { font-size: clamp(26px, 4vw, 40px); }
.qz-rank { list-style: none; width: min(640px, 100%); display: grid; gap: 10px; }
.qz-rank li { display: flex; align-items: center; gap: 14px; background: #fff; color: var(--ink); border-radius: 16px; padding: 14px 18px; font-size: 18px; animation: slideIn .5s both; }
@keyframes slideIn { from { transform: translateX(-30px); opacity: 0; } }
.qz-rank .rk { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--purple-100); color: var(--purple-700); font-weight: 900; }
.qz-rank li:first-child .rk { background: #ffd54f; color: #7a5200; }
.qz-rank b { flex: 1; }
.qz-rank .sc { font-weight: 900; color: var(--purple-700); }
.qz-rank .plus { font-size: 13px; font-weight: 800; color: #2f8a57; background: #e9f8ef; border-radius: 999px; padding: 2px 8px; }
.qz-podium { display: flex; align-items: flex-end; gap: 12px; margin-top: 10px; }
.pd { width: min(180px, 28vw); display: grid; justify-items: center; gap: 4px; text-align: center; animation: popIn .6s both; }
.pd b { font-size: 18px; word-break: break-all; }
.pd span { font-size: 14px; opacity: .85; }
.pd .blk { width: 100%; border-radius: 16px 16px 0 0; background: rgba(255,255,255,.9); color: #5a3d86; font-size: 40px; font-weight: 900; display: grid; place-items: center; }
.pd.p1 .blk { height: 170px; background: linear-gradient(#ffe082, #ffca28); color: #7a5200; }
.pd.p2 .blk { height: 120px; }
.pd.p3 .blk { height: 90px; }
.pd.p1 { animation-delay: .5s; } .pd.p2 { animation-delay: .25s; }
.pd.empty { visibility: hidden; }
.row-btns.center { justify-content: center; }
.qz-board .btn-ghost { background: rgba(255,255,255,.95); }
.qz-all { width: min(640px, 100%); background: rgba(255,255,255,.12); border-radius: 16px; padding: 10px 16px; }
.qz-all summary { cursor: pointer; font-weight: 700; }
.qz-all ol { margin: 8px 0 0 20px; font-size: 14.5px; }

/* 학생 화면 */
.st-center { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 10px; padding: 30px 10px; }
.st-center h2 { font-size: 30px; }
.st-center p { font-size: 17px; opacity: .92; }
.st-big { font-size: 76px; line-height: 1; }
.st-big.pop { animation: popIn .5s cubic-bezier(.2,1.4,.4,1); }
.st-big.spin { animation: spin 1.6s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.st-pts { font-size: 40px !important; font-weight: 900; }
.st-right { background: radial-gradient(circle, rgba(38,169,143,.45), transparent 70%); }
.st-wrong { background: radial-gradient(circle, rgba(226,85,127,.4), transparent 70%); }
.st-q { flex: 1; display: flex; flex-direction: column; gap: 14px; padding-top: 14px; }
.st-qhead { display: flex; justify-content: space-between; align-items: center; font-weight: 700; }
.st-timer { width: 46px; height: 46px; border-radius: 50%; background: #fff; color: #5a3d86; display: grid; place-items: center; font-size: 20px; font-weight: 900; }
.st-qtext { background: #fff; color: var(--ink); border-radius: 18px; padding: 16px; font-size: 18px; font-weight: 700; text-align: center; }
.st-tiles { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; min-height: 300px; }
.st-tiles .qz-tile { flex-direction: column; justify-content: center; text-align: center; gap: 8px; font-size: 17px; padding: 14px 10px; }
.st-tiles .qz-tile .sh { font-size: 34px; }

/* ── 푸터: 교수자 ── */
.footer {
  position: relative; z-index: 1; margin-top: 40px; padding: 64px 20px 40px;
  background: linear-gradient(160deg, #5a3d86 0%, #7a4f9e 45%, #b3628f 100%);
  color: #fff; border-radius: 40px 40px 0 0;
}
.footer-inner { max-width: 1120px; margin: 0 auto; }
.footer-prof { display: grid; grid-template-columns: 180px 1fr; gap: 36px; align-items: center; }
.avatar {
  width: 170px; height: 170px; border-radius: 50%; display: grid; place-items: center; overflow: hidden;
  background: linear-gradient(135deg, var(--pink-200), var(--purple-300)); color: #fff; font-size: 56px; font-weight: 800;
  border: 6px solid rgba(255,255,255,.85); box-shadow: 0 14px 30px -10px rgba(0,0,0,.35); margin: 0 auto;
}
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.footer .eyebrow { background: rgba(255,255,255,.18); color: #ffe4ee; }
.footer h3 { font-size: 28px; margin-top: 12px; }
.footer .pos { color: #ffd3e2; font-weight: 600; margin: 2px 0 12px; }
.footer .intro { color: rgba(255,255,255,.88); max-width: 680px; }
.contacts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 36px; }
.contact { display: flex; gap: 12px; align-items: center; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.2);
  border-radius: 18px; padding: 14px 16px; font-size: 14.5px; word-break: break-all; }
.contact .ic { font-size: 20px; }
.contact small { display: block; color: #ffd3e2; font-size: 12px; }
.contact a { text-decoration: underline; text-underline-offset: 3px; }
.copyright { text-align: center; margin-top: 40px; padding-top: 24px; border-top: 1px solid rgba(255,255,255,.2); font-size: 13.5px; color: rgba(255,255,255,.8); }
.copyright small { display: block; margin-top: 4px; font-size: 12px; opacity: .8; }

/* ── 맨 위로 버튼 ── */
.to-top {
  position: fixed; right: 22px; bottom: 22px; z-index: 60; width: 52px; height: 52px; border-radius: 50%;
  background: linear-gradient(135deg, var(--pink-500), var(--purple-500)); color: #fff; font-size: 22px;
  box-shadow: 0 10px 24px -8px rgba(154, 111, 214, .8);
  opacity: 0; transform: translateY(20px); pointer-events: none; transition: opacity .3s, transform .3s;
}
.to-top.show { opacity: 1; transform: none; pointer-events: auto; }
.to-top:hover { transform: translateY(-3px); }

/* ── 나타나기 애니메이션 ── */
.reveal { opacity: 0; transform: translateY(24px); transition: opacity .7s ease, transform .7s ease; }
.reveal.in { opacity: 1; transform: none; }

/* ── 반응형 ── */
@media (max-width: 960px) {
  .grid-4, .quick-info, .stat-grid { grid-template-columns: repeat(2, 1fr); }
  .weeks, .tool-grid { grid-template-columns: repeat(2, 1fr); }
  .slide-track { grid-auto-columns: calc((100% - 20px) / 2); }
  .cal-wrap, .join-grid, .dash-grid { grid-template-columns: 1fr; }
  .cal-detail { position: static; }
}
@media (max-width: 760px) {
  :root { --header-h: 60px; }
  .menu-btn { display: grid; place-items: center; }
  .nav {
    position: absolute; top: var(--header-h); left: 12px; right: 12px; flex-direction: column; gap: 2px;
    background: #fff; border: 1px solid var(--line); border-radius: 20px; padding: 10px; box-shadow: var(--shadow);
    opacity: 0; transform: translateY(-8px); pointer-events: none; transition: opacity .2s, transform .2s;
  }
  .nav.open { opacity: 1; transform: none; pointer-events: auto; }
  .nav a { padding: 12px 16px; }
  .section { padding: 52px 16px; }
  .hero { padding-top: 28px; }
  .hero-card { padding: 44px 20px; border-radius: 28px; }
  .grid-4, .grid-2, .weeks, .tool-grid, .guide-grid { grid-template-columns: 1fr; }
  .hero-actions { flex-wrap: nowrap; gap: 8px; }
  .hero-actions .btn { padding: 13px 18px; font-size: 15px; white-space: nowrap; }
  .quick-info { grid-template-columns: 1fr 1fr; gap: 10px; }
  .quick { flex-direction: column; align-items: flex-start; gap: 8px; padding: 14px; }
  .quick .ic { width: 38px; height: 38px; font-size: 19px; }
  .quick b { font-size: 13.5px; }
  .stat-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .stat-card { padding: 22px 10px; }
  .card { padding: 22px; }
  .slide-track { grid-auto-columns: 86%; column-gap: 14px; }
  .slide-btn { display: none; }
  .footer { padding: 48px 16px 32px; border-radius: 28px 28px 0 0; }
  .footer-prof { grid-template-columns: 1fr; text-align: center; gap: 18px; }
  .footer .intro { margin: 0 auto; }
  .avatar { width: 130px; height: 130px; font-size: 44px; }
  .contacts { grid-template-columns: 1fr; }
  .acc-head { gap: 12px; padding: 14px 14px; }
  .acc-head .week-num { width: 46px; height: 46px; border-radius: 15px; }
  .acc-head .week-num b { font-size: 17px; }
  .acc-title p { display: none; }
  .acc-badges { flex-direction: column; }
  .acc .chev { display: none; }
  .acc-inner { margin: 0 14px; padding-bottom: 18px; }
  .meta, .acc-cols { grid-template-columns: 1fr; }
  .meta { gap: 8px; }
  .submit-btn { width: 100%; justify-content: center; }
  .cal { padding: 16px 12px; }
  .cal-week, .cal-grid { gap: 3px; }
  .day { border-radius: 10px; font-size: 13px; }
  .day .tag { font-size: 9px; letter-spacing: -.03em; }
  .dot-due { top: 3px; right: 3px; width: 7px; height: 7px; }
  .cal-legend { gap: 10px; font-size: 12px; }
  .fields { grid-template-columns: 1fr; }
  .login-form { grid-template-columns: 1fr; }
  .att-form { grid-template-columns: 1fr 1fr; }
  .att-form .btn { grid-column: 1 / -1; justify-content: center; }
  .att-chips { grid-template-columns: repeat(5, 1fr); }
  .dash-stats b { font-size: 21px; }
  .hist-table thead { display: none; }
  .hist-table tr { display: grid; padding: 10px 0; border-bottom: 1px solid var(--line); gap: 2px; }
  .hist-table td { border: 0; padding: 0; }
  .modal-box { padding: 28px 20px 18px; }
  .qz-grid { grid-template-columns: 1fr; }
  .qz-layer.sheet { padding: 0; }
  .qz-sheet { border-radius: 0; }
  .qz-opts { grid-template-columns: 1fr; }
  .qz-stage-in { padding: 12px 12px 22px; }
  .qz-join-box { padding: 18px; gap: 16px; }
  .qz-qr img { width: 170px; height: 170px; }
  .qz-tiles { grid-template-columns: 1fr; }
  .qz-tile { padding: 14px 16px; }

/* =====================================================================
 * 테마: 따뜻한 베이커리 카페 (크림·베이지 + 커피 브라운, 세리프 제목)
 * 이 블록을 지우면 이전(벚꽃) 색으로 돌아갑니다.
 * ===================================================================== */
:root {
  --pink-50: #fbf6ee;   /* 아이보리 */
  --pink-100: #f3e8d8;  /* 크림 */
  --pink-200: #e7d3b8;  /* 라떼 */
  --pink-400: #b9835a;  /* 캐러멜 */
  --pink-500: #7a4a32;  /* 커피 */
  --purple-100: #efe4d3;
  --purple-300: #c9a27e;
  --purple-500: #8a5a3c;
  --purple-700: #5a3726;
  --ink: #2e2219;
  --ink-soft: #6f5e50;
  --card: #fffaf3;
  --line: #e6d9c6;
  --band: #efe5d6;
  --radius: 12px;
  --shadow: 0 8px 22px -14px rgba(74, 46, 28, .35);
  --serif: "Noto Serif KR", "Nanum Myeongjo", "Batang", "AppleMyungjo", serif;
}
body {
  font-family: "Noto Sans KR", "Pretendard", -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  background: #f6efe4;
}
.petals { display: none; }
h1, h2, .section-head h2, .card-title, .jc-head h3, .notice-head h2, .qz-board h2, .modal-box h3, .footer h3, .cal-month, .slide h3, .feature h3 {
  font-family: var(--serif); letter-spacing: -.01em;
}

/* 헤더 */
.header { background: rgba(250, 245, 237, .94); }
.header.scrolled { border-color: var(--line); box-shadow: 0 6px 18px -14px rgba(74, 46, 28, .4); }
.brand { font-family: var(--serif); letter-spacing: .02em; }
.brand-mark { background: var(--pink-500); border-radius: 50%; font-family: var(--serif); font-size: 17px; }
.nav a { color: var(--ink); font-size: 14.5px; }
.nav a:hover { background: var(--pink-100); }
.nav a.active { background: none; color: var(--pink-500); box-shadow: inset 0 -2px 0 var(--pink-500); border-radius: 0; }
.nav a[data-id="participate"] { background: var(--pink-500); color: #fff8ee; border-radius: 999px; box-shadow: none; margin-left: 6px; }
.nav a[data-id="participate"]:hover, .nav a[data-id="participate"].active { background: var(--purple-700); color: #fff; }

/* 공통 */
.eyebrow { background: none; color: var(--pink-400); letter-spacing: .28em; padding: 0; font-size: 11.5px; }
.section-head .eyebrow::before { content: "❦"; display: block; font-size: 22px; letter-spacing: 0; color: var(--pink-500); margin-bottom: 6px; }
.section-head h2 { font-weight: 900; color: var(--ink); }
.section-head h2::after { content: ""; display: block; width: 46px; height: 2px; background: var(--pink-400); margin: 12px auto 0; }
.card { border-radius: var(--radius); background: var(--card); backdrop-filter: none; }
.card:hover { box-shadow: 0 14px 28px -16px rgba(74, 46, 28, .45); }
.btn { border-radius: 999px; letter-spacing: .02em; }
.btn-primary { background: var(--pink-500); color: #fff8ee; box-shadow: 0 8px 18px -10px rgba(74, 46, 28, .7); }
.btn-primary:hover { background: var(--purple-700); }
.btn-ghost { background: transparent; color: var(--pink-500); border: 1.5px solid var(--pink-500); }
.btn-ghost:hover { background: var(--pink-100); }
/* 베이지 띠 배경 (섹션을 번갈아) */
#about, #tools, #faq { position: relative; }
#about::before, #tools::before, #faq::before { content: ""; position: absolute; inset: 0 calc(50% - 50vw); background: var(--band); z-index: -1; }
main { z-index: 1; isolation: isolate; }

/* 첫 화면: 책상 위 플랫레이 */
.hero { padding-top: 28px; }
.hero-card {
  border-radius: 6px; padding: 0; min-height: 520px; display: grid; place-items: center;
  background:
    repeating-linear-gradient(90deg, rgba(255,255,255,.0) 0 118px, rgba(120, 90, 60, .07) 118px 120px),
    linear-gradient(180deg, #f1e7d8, #eadcc6);
  border: 0; box-shadow: 0 20px 40px -26px rgba(74, 46, 28, .55);
}
.hero-card::before, .hero-card::after { display: none; }
.hero-text { position: relative; z-index: 2; background: rgba(251, 246, 238, .93); padding: 40px 48px 36px; max-width: 620px; margin: 40px 20px; box-shadow: 0 18px 40px -24px rgba(74, 46, 28, .5); }
.badge { background: none; box-shadow: none; color: var(--pink-400); font-size: 12px; letter-spacing: .3em; padding: 0; }
.hero h1 { background: none; -webkit-text-fill-color: currentColor; color: var(--ink); font-weight: 900; margin: 12px 0 6px; }
.hero-sub { color: var(--pink-500); font-family: var(--serif); }
.hero-desc { color: var(--ink-soft); }
.hero-deco { position: absolute; inset: 0; overflow: hidden; z-index: 1; }
.plate { position: absolute; display: grid; place-items: center; border-radius: 50%; background: #fffdf8; box-shadow: 0 14px 26px -12px rgba(74, 46, 28, .45), inset 0 0 0 10px #f6efe4; line-height: 1; }
.d1 { width: 130px; height: 130px; font-size: 54px; left: 44px; top: 34px; }
.d3 { width: 92px; height: 92px; font-size: 40px; left: 26px; top: 205px; }
.d2 { width: 150px; height: 150px; font-size: 66px; left: 52px; top: 322px; transform: rotate(-12deg); }
.d4 { width: 130px; height: 130px; font-size: 56px; right: 44px; top: 34px; transform: rotate(8deg); }
.d6 { width: 92px; height: 92px; font-size: 38px; right: 26px; top: 205px; }
.d5 { width: 150px; height: 150px; font-size: 76px; right: 52px; top: 322px; }
.d7, .d8 { display: none; }
@media (max-width: 1100px) and (min-width: 761px) { .hero-text { max-width: 480px; } .d1, .d4 { width: 104px; height: 104px; font-size: 44px; } .d2, .d5 { width: 120px; height: 120px; font-size: 54px; } .d3, .d6 { display: none; } }
.quick { background: var(--card); border-radius: var(--radius); }
.quick .ic, .feature .icon, .info-item .ic, .prep .ic, .jc-ic, .tool-icon { background: var(--pink-100); }
.quick small { color: var(--pink-400); }

/* 통계 */
.stat-card { border-top: 3px solid var(--pink-400); }
.stat-num { background: none; -webkit-text-fill-color: currentColor; color: var(--pink-500); font-family: var(--serif); }

/* 장점 슬라이드: 위는 '사진', 아래는 글 (참고 이미지의 카드처럼) */
.slide { padding: 0 0 26px; overflow: hidden; text-align: center; min-height: 0; }
.slide-icon { width: 100%; height: 150px; border-radius: 0; margin: 0 0 18px; font-size: 64px;
  background: radial-gradient(circle at 50% 60%, #fffaf2 0 34%, transparent 35%), linear-gradient(135deg, #8a5a3c, #4a2e1f); }
.slide h3, .slide p { padding: 0 22px; }
.slide-no { color: rgba(255, 248, 238, .65); top: 12px; right: 16px; font-size: 26px; font-family: var(--serif); }
.slide-btn { background: var(--card); color: var(--pink-500); }
.dot { background: var(--pink-200); }
.dot.on { background: var(--pink-500); }

/* 커리큘럼 · 달력 */
.acc-head .week-num { background: var(--pink-500); border-radius: 10px; }
.acc.exam { background: #f6ecdc; }
.acc.exam .week-num { background: var(--pink-400); }
.acc-date { color: var(--pink-400); }
.hw-pill { background: #f3dfc6; color: #7a4a32; }
.exam-pill { background: var(--purple-100); color: var(--purple-700); }
.assign { background: #fbf2e5; border-color: var(--pink-200); border-radius: 10px; }
.assign-tag { background: var(--pink-500); }
.video { background: var(--pink-100); color: var(--pink-500); }
.day { border-radius: 8px; }
.day.has-class { background: var(--pink-100); color: var(--pink-500); }
.day.has-exam { background: var(--pink-500); }
.day.holi { background: repeating-linear-gradient(45deg, #fffaf2, #fffaf2 4px, #f1e2cf 4px, #f1e2cf 8px); color: #9a6a4a; }
.day.sel { outline-color: var(--pink-500); }
.lg.class { background: var(--pink-100); } .lg.exam { background: var(--pink-500); }

/* 수강 안내 · FAQ · 기타 */
.bar-fill, .bar-track { border-radius: 999px; }
.bar-fill { background: linear-gradient(90deg, var(--pink-400), var(--pink-500)); }
.bar-track { background: var(--pink-100); }
.notes li::before, .modal-box li::before { content: "•"; color: var(--pink-400); font-size: 18px; top: -3px; }
.faq-q .q-mark { color: var(--pink-400); font-family: var(--serif); }
.faq-item.open .chev { background: var(--pink-200); }
.tag, .pill { border-radius: 999px; }
.to-top { background: var(--pink-500); }
.notice.imp { background: #fbf2e5; border-color: var(--pink-200); }
.imp-pill { background: var(--pink-500); }

/* 참여하기 */
.demo-note { border-color: var(--purple-300); background: var(--card); }
.poll-opt { border-radius: 10px; background: var(--card); }
.po-bar { background: var(--pink-100); }
.poll-opt.top .po-bar { background: linear-gradient(90deg, #e2c4a0, #d3a97c); }
.po-label em { background: var(--pink-500); }
.radio input:checked + span { background: var(--pink-500); }
.dash-stats div { background: var(--pink-100); }
.chip.ok { background: var(--pink-500); }
.drop { border-color: var(--purple-300); background: var(--pink-50); }

/* 팝업 */
.modal-box { background: var(--card); border-radius: 14px; }
.modal-box h3 { font-weight: 900; }

/* 푸터: 짙은 커피색 */
.footer { background: linear-gradient(160deg, #3b261a, #4f3222 60%, #6b4430); border-radius: 0; }
.footer .eyebrow { color: #e7c9a2; background: none; }

.contact small { color: #e7c9a2; }

/* 관리자 · 퀴즈 */
.admin-side { background: linear-gradient(180deg, #3b261a, #6b4430); }
.admin-menu button.on { color: var(--pink-500); }
.sub-tabs button.on { background: var(--pink-500); }
.admin-box, .qz-sheet { border-radius: 16px; }
.qz-layer.stage { background: radial-gradient(circle at 15% 10%, #8a5a3c 0, transparent 45%), radial-gradient(circle at 85% 90%, #b9835a 0, transparent 45%), linear-gradient(135deg, #2e1d13, #4f3222 50%, #6b4430); }
.qz-go { color: var(--pink-500); }
.qz-timer b { background: #4f3222; }
.qz-count, .st-timer { color: var(--pink-500); }
.c0 { --c: #c0573e; } .c1 { --c: #4f6d8f; } .c2 { --c: #d19a2e; } .c3 { --c: #5f8a4e; }

@media (max-width: 760px) {
  .nav a[data-id="participate"] { margin: 4px 0 0; text-align: center; }
  .nav a.active { box-shadow: none; background: var(--pink-100); border-radius: 12px; }

}

  <section id="s1">
    <h2><span class="n">1</span>파일 구성</h2>
    <p>사이트는 <code>index.html</code> <b>파일 하나</b>로 되어 있습니다. 디자인·기능·내용·이 안내서까지 모두 이 파일 안에 들어 있어서, 파일 하나만 옮기거나 올리면 됩니다.</p>
    <table>
      <tr><th>파일 안의 부분</th><th>역할</th><th>고칠 일</th></tr>
      <tr><td><b>★ 사이트 설정 ★</b> 블록</td><td><b>사이트의 모든 내용</b> — 강의 정보, 커리큘럼, 일정, FAQ, 교수자, 명단, 공지, 퀴즈, 관리자 비밀번호(해시)</td><td><b>여기만 고치면 됩니다</b></td></tr>
      <tr><td>&lt;style&gt; 부분</td><td>색상·디자인</td><td>없음</td></tr>
      <tr><td>나머지 &lt;script&gt; 부분</td><td>화면 그리기, 커리큘럼·달력, 참여 기능, 관리자 모드, 실시간 퀴즈, QR 코드(공개 라이브러리, MIT)</td><td>없음</td></tr>
      <tr><td>사용 안내서</td><td>관리자 화면 → 한눈에 보기 → <b>📘 사용 안내서 열기</b></td><td>없음</td></tr>
    </table>
    <div class="tip">💡 교수자 사진을 쓰려면 사진 파일을 <code>index.html</code> 과 <b>같은 폴더</b>에 두고, 배포할 때도 함께 올리세요. (사진은 인터넷 주소로 넣어도 됩니다)</div>
  </section>

  <section id="s2">
    <h2><span class="n">2</span>사이트 열기</h2>
    <p>서버나 설치가 필요 없습니다. 폴더에서 <code>index.html</code> 을 더블클릭하면 기본 브라우저(크롬·엣지 권장)에서 열립니다.</p>
    <p>내용을 고친 뒤에는 브라우저에서 <b>새로고침(F5)</b> 하면 바로 반영됩니다.</p>
    <div class="tip">💡 처음 방문 효과(폭죽·팝업)를 다시 보고 싶으면 <b>크롬 시크릿 창(Ctrl+Shift+N)</b> 에 <code>index.html</code> 을 끌어다 놓으세요.</div>
  </section>

    <h3>수강생 로그인과 출석</h3>
    <ul>
      <li>로그인은 <b>학번 + 이름</b>입니다. 관리자 화면의 <b>수강생 명단</b>에 등록된 학생, 또는 수강 신청서를 낸 학생만 들어올 수 있습니다.</li>
      <li>출석은 수업 시간에 알려 주는 <b>출석 코드</b>(기본 <code>1234</code>)를 입력해야 합니다. 관리자 화면 → 사이트 편집 → 참여·팝업 → 수강생 공간에서 바꿉니다.</li>
      <li>'아무 날이나 출석 허용'을 끄면 수업 당일에만 출석할 수 있습니다.</li>
    </ul>
  </section>

  <section id="s4">
    <h2><span class="n">4</span>관리자 모드</h2>
    <ol class="steps">
      <li>오른쪽 위 <b>🔒</b> 를 누르고 비밀번호를 입력합니다. 처음 비밀번호는 사이트를 만들 때 따로 전달받은 값입니다. (보안을 위해 이 안내서와 코드에는 적지 않았습니다) <b>배포 전에 꼭 바꾸세요.</b></li>
      <li>왼쪽 메뉴에서 작업을 고릅니다. 고친 뒤에는 아래에 나타나는 <b>저장하고 사이트에 적용</b>을 눌러야 반영됩니다.</li>
      <li>다 쓰면 <b>잠그고 나가기</b>를 누르세요. (브라우저 탭을 닫아도 잠깁니다)</li>
    </ol>
    <table>
      <tr><th>메뉴</th><th>할 수 있는 일</th></tr>
      <tr><td>🏠 한눈에 보기</td><td>신청·명단·출석·과제·공지·투표 숫자 요약</td></tr>
      <tr><td>✏️ 사이트 편집</td><td>사이트 정보, 첫 화면, 통계, 슬라이드, 커리큘럼(과제 추가/빼기), 일정·휴강일, AI 도구, 수강 안내, FAQ, 투표·신청서·팝업, 교수자 정보를 입력 칸에서 바로 수정. 목록은 ↑↓ 로 순서 변경, ✕ 로 삭제, <b>+ 추가</b> 로 새 항목</td></tr>
      <tr><td>📢 공지사항</td><td>제목·날짜·내용 입력 후 공지 추가, ★ 로 중요 표시, ✕ 로 삭제</td></tr>
      <tr><td>👥 수강생 명단</td><td>한 명씩 추가, 엑셀에서 '학번, 이름' 두 열을 복사해 한꺼번에 붙여 넣기, CSV 파일 불러오기, 신청자를 명단에 추가, 명단 내려받기</td></tr>
      <tr><td>📝 수강 신청 내역</td><td>제출된 신청서 표 · <b>엑셀용 파일(CSV)</b> 내려받기</td></tr>
      <tr><td>✅ 출석 현황</td><td>학생 × 15주 출석표, 출석률 · CSV 내려받기</td></tr>
      <tr><td>📤 과제 제출 현황</td><td>과제별 제출/지각/미제출 · CSV 내려받기 (파일명·제출 시각 포함)</td></tr>
      <tr><td>🗳️ 투표 결과</td><td>막대그래프 · CSV 내려받기 · 실제 투표 기록 지우기</td></tr>
      <tr><td>💾 설정 파일</td><td>설정 백업(.json) · <b>index.html 로 내보내기</b> · 파일 불러오기 · 원래 설정으로 되돌리기 · 학생 기록 지우기</td></tr>
      <tr><td>🔑 비밀번호</td><td>새 비밀번호로 변경 (해시값으로만 저장)</td></tr>

    <h3>내려받은 CSV 파일 이름</h3>
    <p><code>applications_날짜.csv</code>(신청서) · <code>attendance_날짜.csv</code>(출석) · <code>assignments_날짜.csv</code>(과제) · <code>poll_날짜.csv</code>(투표) · <code>roster_날짜.csv</code>(명단) · <code>site-settings_날짜.json</code>(설정 백업)</p>
    <p>CSV 파일은 더블클릭하면 엑셀에서 한글이 깨지지 않고 열립니다.</p>
    <div class="warn">⚠️ <b>관리자 화면에서 고친 내용은 '그 브라우저'에만 저장됩니다.</b> 다른 컴퓨터나 배포한 사이트에도 적용하려면 <b>설정 파일 → index.html 로 내보내기</b>로 받은 파일로 원래 <code>index.html</code> 을 바꿔 주세요.</div>
  </section>

  <section id="s4q">
    <h2><span class="n">Q</span>실시간 퀴즈 (Kahoot 방식)</h2>
    <p>참여하기 → 수강생 공간 아래 <b>🎮 실시간 퀴즈</b>에 있습니다. 퀴즈 만들기·진행은 관리자 로그인 후에만 보입니다.</p>
    <h3>퀴즈 만들기</h3>
    <ul>
      <li><b>✏️ 수정 / ＋ 새 퀴즈</b>: 문제, 선택지 2~4개, 정답(동그라미 선택), 제한 시간, 해설을 입력하고 저장합니다.</li>
      <li><b>🤖 AI 문제 출제 · 방법 1(무료)</b>: 주제·문항 수·난이도를 고르고 <b>프롬프트 복사</b> → Claude·ChatGPT·Gemini에 붙여 넣기 → 받은 답(JSON)을 그대로 붙여 넣고 <b>붙여 넣은 문제 추가</b>.</li>
      <li><b>방법 2(API 키)</b>: 본인의 Anthropic API 키가 있으면 <b>바로 출제</b> 버튼 한 번으로 문제가 들어옵니다. 키는 그 브라우저에만 보관됩니다. 모델 이름은 사이트 설정의 <code>quiz.ai.model</code> 에서 바꿉니다.</li>
      <li>AI가 만든 문제는 <b>반드시 정답과 내용을 확인</b>한 뒤 저장하세요.</li>
    </ul>
    <h3>진행하기</h3>
    <ol class="steps">
      <li><b>▶ 퀴즈 시작</b> → 화면에 PIN 번호와 QR 코드가 나옵니다. (빔프로젝터로 띄우세요)</li>
      <li>학생은 QR을 찍거나 사이트의 실시간 퀴즈 칸에 PIN·닉네임을 넣고 입장합니다. 입장한 이름이 화면에 나타납니다.</li>
      <li><b>시작하기</b> → 문제가 나오고 타이머가 돕니다. 학생은 휴대폰에서 색깔·모양 버튼을 누릅니다.</li>
      <li>모두 답하거나 시간이 끝나면 정답과 선택 분포가 공개됩니다 → <b>순위 보기</b> → <b>다음 문제</b>.</li>
      <li>마지막에 1~3등 시상대가 나오고, <b>퀴즈 결과 CSV</b>(학생별·문항별 선택, 정답 여부, 응답 시간, 점수)와 <b>문항별 정답률 CSV</b>를 내려받을 수 있습니다. 지난 결과는 퀴즈 칸에서 다시 받을 수 있습니다.</li>
    </ol>
    <p>점수는 정답일 때 최대 1,000점이며, 빨리 맞힐수록 높습니다(Kahoot과 같은 방식).</p>
    <div class="warn">⚠️ <b>데모 모드</b>: 교수자 화면과 학생 화면은 <b>같은 컴퓨터의 브라우저 탭끼리만</b> 연결됩니다. 시연할 때는 대기 화면의 <b>🧪 학생 탭 열기</b>로 학생 탭을 여러 개 열어 보세요. 실제로 학생들 휴대폰을 연결하려면 사이트를 배포하고 실시간 연결 서비스(예: Firebase, PeerJS)를 붙여야 합니다.</div>
  </section>

  <section id="s5">
    <h2><span class="n">5</span>파일을 직접 고치기</h2>
    <p>관리자 화면 대신 파일을 직접 고쳐도 됩니다. <code>index.html</code> 을 <b>오른쪽 클릭 → 연결 프로그램 → 메모장</b>(또는 VS Code)으로 열고, <b>Ctrl+F</b> 로 <code>★ 사이트 설정 ★</code> 을 찾으세요. 그 아래 블록이 사이트 내용입니다.</p>
    <pre><code>instructor: {
  name: "○○○ 교수",          ← 따옴표 안만 바꾸기
  position: "고려대학교 경영대학 회계학 전공",
  photo: "professor.jpg",     ← 같은 폴더의 사진 파일 이름
  ...</code></pre>
    <ul>
      <li>설정 블록 밖(디자인·기능 코드)은 고치지 마세요.</li>
      <li>따옴표 <code>" "</code>, 쉼표 <code>,</code>, 괄호 <code>{ } [ ]</code> 는 지우지 마세요.</li>
      <li>저장(Ctrl+S) 후 브라우저를 새로고침(F5) 하면 반영됩니다.</li>
      <li>날짜는 <code>2026-03-03</code>, 과제 마감은 <code>2026-03-23 23:59</code> 형식입니다.</li>
      <li>개강일(<code>schedule.startDate</code>)·수업 요일(<code>classDay</code>)·휴강일(<code>holidays</code>)을 바꾸면 모든 주차 날짜와 달력이 자동으로 다시 계산됩니다.</li>
    </ul>
    <div class="warn">⚠️ 관리자 화면에서 한 번이라도 저장했다면 그 브라우저는 '고친 설정'을 우선 사용합니다. 파일을 직접 고쳤는데 반영되지 않으면 관리자 화면 → 설정 파일 → <b>기본 설정으로 되돌리기</b>를 누르세요.</div>
  </section>

  <section id="s6">
    <h2><span class="n">6</span>데이터 저장 방식 (꼭 읽어 주세요)</h2>
    <p>이 사이트는 <b>서버 없는 정적 사이트(데모 모드)</b>입니다. 투표, 수강 신청서, 로그인, 출석, 과제 제출 기록은 <b>각자의 브라우저 안(localStorage)</b>에만 저장됩니다.</p>
    <ul>
      <li>학생 A의 투표·신청서·출석은 학생 B나 교수자의 컴퓨터에 모이지 <b>않습니다</b>.</li>
      <li>관리자 화면의 신청·출석·과제 현황은 <b>그 브라우저에서 입력된 기록</b>만 보여 줍니다. (강의실 공용 PC에서 출석을 받는 식으로는 쓸 수 있습니다)</li>
      <li>과제 제출은 파일 자체가 아니라 <b>파일 이름·크기·제출 시각</b>만 기록합니다.</li>
      <li>브라우저 기록(쿠키·사이트 데이터)을 지우면 저장된 기록도 사라집니다.</li>
    </ul>
    <div class="tip">💡 실제 수업에서 모든 학생의 응답을 한곳에 모으려면 <b>구글 시트·구글 드라이브 연동</b>(Apps Script) 같은 저장소를 붙여야 합니다. 그 전까지는 과제 제출에 <code>schedule.submitUrl</code> 로 LMS(Blackboard) 제출 주소를 연결하는 것을 권장합니다. 주소를 넣으면 '제출하기' 버튼이 LMS를 엽니다.</div>

        <div class="cd-meta"><span>⏰ ${esc(w._time)}</span><span>📍 ${esc(w._place)}</span></div>
        <ul class="topics">${(w.contents || []).map((c) => `<li>${esc(c)}</li>`).join("")}</ul>
        ${w.assignment ? `<div class="cd-hw">📝 이번 주 과제: <b>${esc(w.assignment.title)}</b><br><small>마감 ${esc(fmtDue(w.assignment._due))}</small></div>` : ""}
        <button class="btn btn-ghost cd-go" data-week="${w.week}">커리큘럼에서 자세히 보기 →</button>`;
    } else if (holi) {
      html += `<div class="cd-empty">☕<b>${esc(holi)}</b><span>이 날은 수업이 없습니다.</span></div>`;
    } else if (!dues.length) {
      html += `<div class="cd-empty">☕<b>수업이 없는 날입니다</b><span>달력에서 색이 칠해진 날짜를 눌러 보세요.</span></div>`;
    }
    dues.forEach((dw) => {
      const r = remain(dw.assignment._due);
      html += `<div class="cd-due"><b>⏰ 과제 마감 · ${esc(dw.assignment.title)}</b>
        <small>${esc(fmtDue(dw.assignment._due))} — ${esc(r.text)}</small>
        <button class="btn btn-ghost cd-go" data-week="${dw.week}">${dw.week}주차 과제 보기 →</button></div>`;
    });
    $(".cal-detail").innerHTML = html;
  };

  $$(".cal-nav").forEach((b) => b.addEventListener("click", () => { view.setMonth(view.getMonth() + Number(b.dataset.d)); renderCal(); }));
  $(".cal-today").addEventListener("click", () => { view = new Date(today); view.setDate(1); selected = ymd(today); renderCal(); renderDetail(); });
  $(".cal-grid").addEventListener("click", (e) => {
    const b = e.target.closest(".day"); if (!b) return;
    selected = b.dataset.date;
    const d = parseDate(selected);
    if (d.getMonth() !== view.getMonth()) { view = new Date(d.getFullYear(), d.getMonth(), 1); }
    renderCal(); renderDetail();
  });
  $(".cal-detail").addEventListener("click", (e) => { const b = e.target.closest(".cd-go"); if (b) openWeek(b.dataset.week); });
  renderCal(); renderDetail();

  /* 다른 스크립트(participate.js)에서 쓰는 도구 */
  window.SITE = { toast, weeks, fmtDue, fmtDate, fmtShort, remain, ymd, openWeek, esc, head };

  /* ── AI 도구 ── */
  $("#tools").innerHTML = head(C.tools) + `
    <div class="tool-grid">${C.tools.items.map((t) => `
      <div class="card tool reveal">
        <div class="tool-icon">${esc(t.icon)}</div>
        <div><h3>${esc(t.name)}</h3><p>${esc(t.use)}</p></div>
      </div>`).join("")}
    </div>`;

  /* ── 수강 안내 + 준비물 ── */
  const g = C.guide;
  $("#guide").innerHTML = head(g) + `
    <div class="guide-grid">
      <div class="card reveal">
        <h3 class="card-title">📝 평가 방법</h3>
        ${g.grading.map((b) => `
          <div class="bar"><div class="bar-top"><span>${esc(b.label)}</span><b>${esc(b.percent)}%</b></div>
          <div class="bar-track"><div class="bar-fill" data-w="${Number(b.percent) || 0}"></div></div></div>`).join("")}
        <ul class="notes">${g.notes.map((n) => `<li>${esc(n)}</li>`).join("")}</ul>
      </div>
      <div class="card reveal">
        <h3 class="card-title">🎒 ${esc(g.prepTitle)}</h3>
        <div class="prep-list">${g.prep.map((p) => `
          <div class="prep"><span class="ic">${esc(p.icon)}</span><div><b>${esc(p.title)}</b><p>${esc(p.text)}</p></div></div>`).join("")}
        </div>
      </div>
    </div>`;

  /* ── FAQ ── */
  $("#faq").innerHTML = head(C.faq) + `
    <div class="faq-list">${C.faq.items.map((f, i) => `
      <div class="card faq-item reveal">
        <button class="faq-q" aria-expanded="false" aria-controls="faq-a-${i}">
          <span><span class="q-mark">Q.</span>${esc(f.q)}</span><span class="chev">+</span>
        </button>
        <div class="faq-a" id="faq-a-${i}"><p>${esc(f.a)}</p></div>
      </div>`).join("")}
    </div>`;
  $$(".faq-item").forEach((item) => {
    const btn = $(".faq-q", item), ans = $(".faq-a", item);
    btn.addEventListener("click", () => {
      const open = item.classList.toggle("open");
      btn.setAttribute("aria-expanded", open);
      ans.style.maxHeight = open ? ans.scrollHeight + "px" : 0;
    });
  });

  /* ── 푸터: 교수자 ── */
  const p = C.instructor;
  const initial = (p.name || "?").trim().charAt(0);
  $("#instructor").innerHTML = `
    <div class="footer-inner">
      <div class="footer-prof">
        <div class="avatar">${p.photo ? `<img src="${esc(p.photo)}" alt="${esc(p.name)}">` : esc(initial)}</div>
        <div class="prof-text">
          <span class="eyebrow">INSTRUCTOR</span>
          <h3>${esc(p.name)}</h3>
          <div class="pos">${esc(p.position)}</div>
          <p class="intro">${esc(p.intro)}</p>
        </div>
      </div>
      <div class="contacts">${p.contacts.map((c) => {
        const val = c.link ? `<a href="${esc(c.link)}">${esc(c.value)}</a>` : esc(c.value);
        return `<div class="contact"><span class="ic">${esc(c.icon)}</span><div><small>${esc(c.label)}</small>${val}</div></div>`;
      }).join("")}
      </div>
      <div class="copyright">${esc(C.footer.text)}<small>${esc(C.footer.sub)}</small></div>
    </div>`;

  /* ── 벚꽃잎 ── */
  const petals = $("#petals");
  for (let i = 0; i < 14; i++) {
    const el = document.createElement("span");
    el.className = "petal";
    el.style.left = Math.random() * 100 + "vw";
    el.style.animationDuration = 9 + Math.random() * 10 + "s";
    el.style.animationDelay = -Math.random() * 15 + "s";
    el.style.width = 8 + Math.random() * 8 + "px";
    el.style.height = 7 + Math.random() * 6 + "px";
    petals.appendChild(el);
  }

  /* ── 모바일 메뉴 ── */
  const nav = $("#nav"), menuBtn = $("#menuBtn");
  const closeMenu = () => { nav.classList.remove("open"); menuBtn.textContent = "☰"; menuBtn.setAttribute("aria-expanded", false); };
  menuBtn.addEventListener("click", () => {
    const open = nav.classList.toggle("open");
    menuBtn.setAttribute("aria-expanded", open);
    menuBtn.textContent = open ? "✕" : "☰";
  });
  nav.addEventListener("click", (e) => { if (e.target.tagName === "A") closeMenu(); });

  /* ── 스크롤: 헤더 그림자, 맨 위로 버튼, 현재 메뉴 표시 ── */
  const header = $("#header"), toTop = $("#toTop");
  const links = $$("a", nav);
  const onScroll = () => {
    const y = window.scrollY;
    header.classList.toggle("scrolled", y > 10);
    toTop.classList.toggle("show", y > 500);
    let current = "";
    C.nav.forEach((n) => {
      const sec = document.getElementById(n.id);
      if (sec && sec.getBoundingClientRect().top < window.innerHeight * 0.35) current = n.id;
    });
    if (window.innerHeight + y >= document.documentElement.scrollHeight - 4) current = C.nav[C.nav.length - 1].id;
    links.forEach((a) => a.classList.toggle("active", a.dataset.id === current));
  };
  window.addEventListener("scroll", onScroll, { passive: true });
  onScroll();
  toTop.addEventListener("click", () => window.scrollTo({ top: 0, behavior: "smooth" }));

  /* ── 나타나기 애니메이션, 평가 막대, 숫자 카운트 ── */
  const countUp = (el) => {
    const to = Number(el.dataset.to), dur = 1400, t0 = performance.now();
    const tick = (t) => {
      const k = Math.min(1, (t - t0) / dur);
      el.textContent = Math.round(to * (1 - Math.pow(1 - k, 3)));
      if (k < 1) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  };
  const io = new IntersectionObserver((entries) => {
    entries.forEach((en) => {
      if (!en.isIntersecting) return;
      en.target.classList.add("in");
      $$(".bar-fill", en.target).forEach((b) => (b.style.width = b.dataset.w + "%"));
      $$(".count", en.target).forEach(countUp);
      io.unobserve(en.target);
    });
  }, { threshold: 0.12 });
  $$(".reveal").forEach((el) => io.observe(el));
})();
</script>
<script data-part="participate">
/* 참여 기능: 투표 · 수강 신청서 · 로그인/출석/과제 제출 · 첫 방문 팝업 · 폭죽
 * 데모 모드 — 모든 데이터는 이 브라우저의 localStorage 에만 저장됩니다.
 * 내용은 사이트 설정 에서 고치세요. 이 파일은 수정할 필요가 없습니다. */
(function () {
  const C = window.SITE_CONFIG, P = C.participate, U = window.SITE;
  const { esc, toast, weeks, fmtDue, fmtShort, remain, ymd, head } = U;
  const $ = (s, el = document) => el.querySelector(s);
  const $$ = (s, el = document) => [...el.querySelectorAll(s)];

  /* ── 저장소 (실패해도 사이트가 멈추지 않도록) ── */
  const KEY = "fa-site:";
  const mem = {};
  const store = {
    get(k, def) {
      try { const v = localStorage.getItem(KEY + k); return v == null ? def : JSON.parse(v); }
      catch (e) { return k in mem ? mem[k] : def; }
    },
    set(k, v) {
      mem[k] = v;
      try { localStorage.setItem(KEY + k, JSON.stringify(v)); } catch (e) {}
    },
    del(k) { delete mem[k]; try { localStorage.removeItem(KEY + k); } catch (e) {} },
  };

  /* ── 섹션 뼈대 ── */
  const sec = $("#participate");
  sec.innerHTML = head(P) + `
    <div class="demo-note">💾 ${esc(P.demoNotice)}</div>
    <div class="join-grid">
      <div class="card join-card pj" id="poll"></div>
      <div class="card join-card pj" id="apply"></div>
    </div>
    <div class="card join-card pj portal" id="portal"></div>`;

  /* =========================================================
   * 1) 실시간 투표
   * ========================================================= */
  const poll = P.poll;
  const renderPoll = () => {
    const votes = store.get("poll-votes", {});
    const mine = store.get("poll-mine", null);
    const counts = poll.options.map((o) => (Number(o.seed) || 0) + (votes[o.id] || 0));
    const total = counts.reduce((a, b) => a + b, 0);
    const max = Math.max(...counts, 1);
    const voted = mine != null;
    $("#poll").innerHTML = `
      <div class="jc-head"><span class="jc-ic">🗳️</span><div><small>실시간 투표</small><h3>${esc(poll.question)}</h3></div></div>
      <div class="poll-list">${poll.options.map((o, i) => {
        const pct = total ? Math.round((counts[i] / total) * 100) : 0;
        return `
        <button class="poll-opt ${mine === o.id ? "mine" : ""} ${counts[i] === max && total ? "top" : ""}" data-id="${esc(o.id)}" ${voted && !poll.allowChange ? "disabled" : ""}>
          <span class="po-bar" data-w="${voted ? (counts[i] / max) * 100 : 0}"></span>
          <span class="po-label">${esc(o.label)} ${mine === o.id ? '<em>내 선택</em>' : ""}</span>
          <span class="po-val">${voted ? `${counts[i]}표 · ${pct}%` : ""}</span>
        </button>`;
      }).join("")}
      </div>
      <div class="poll-foot">${voted
        ? `총 <b>${total}</b>표 참여 · ${poll.allowChange ? "다른 항목을 누르면 투표를 바꿀 수 있어요" : "투표해 주셔서 감사합니다"}`
        : "항목을 눌러 투표하면 결과가 막대그래프로 나타납니다."}</div>`;
    requestAnimationFrame(() => requestAnimationFrame(() => $$("#poll .po-bar").forEach((b) => (b.style.width = b.dataset.w + "%"))));
  };
  $("#poll").addEventListener("click", (e) => {
    const b = e.target.closest(".poll-opt");
    if (!b || b.disabled) return;
    const id = b.dataset.id, mine = store.get("poll-mine", null);
    if (mine === id) return;
    const votes = store.get("poll-votes", {});
    if (mine != null) votes[mine] = Math.max(0, (votes[mine] || 0) - 1);
    votes[id] = (votes[id] || 0) + 1;
    store.set("poll-votes", votes);
    store.set("poll-mine", id);
    // 막대가 0에서 자라나도록 두 번 그리기
    renderPoll();
    toast(mine == null ? "투표가 반영되었습니다 ✔" : "투표를 바꿨습니다");
  });
  // 같은 브라우저의 다른 탭에서 투표하면 바로 반영 (실시간)
  window.addEventListener("storage", (e) => { if (e.key && e.key.startsWith(KEY + "poll")) renderPoll(); });
  renderPoll();

  /* =========================================================
   * 2) 수강 신청서
   * ========================================================= */
  const A = P.application;
  const fieldHtml = (f) => {
    const req = f.required ? '<span class="req">*</span>' : "";
    const id = "f-" + f.name;
    let input;
    if (f.type === "select") {
      input = `<select id="${id}" name="${esc(f.name)}"><option value="">선택하세요</option>${f.options.map((o) => `<option>${esc(o)}</option>`).join("")}</select>`;
    } else if (f.type === "radio") {
      input = `<div class="radios" role="radiogroup" id="${id}">${f.options.map((o) => `<label class="radio"><input type="radio" name="${esc(f.name)}" value="${esc(o)}"><span>${esc(o)}</span></label>`).join("")}</div>`;
    } else if (f.type === "textarea") {
      input = `<textarea id="${id}" name="${esc(f.name)}" rows="4" placeholder="${esc(f.placeholder || "")}"></textarea>`;
    } else if (f.type === "checkbox") {
      return `<div class="field full" data-field="${esc(f.name)}"><label class="check"><input type="checkbox" id="${id}" name="${esc(f.name)}"><span>${esc(f.label)} ${req}</span></label><div class="err"></div></div>`;
    } else {
      input = `<input id="${id}" name="${esc(f.name)}" type="${esc(f.type)}" placeholder="${esc(f.placeholder || "")}" autocomplete="off">`;
    }
    const full = ["textarea", "radio"].includes(f.type) ? "full" : "";
    return `<div class="field ${full}" data-field="${esc(f.name)}"><label for="${id}">${esc(f.label)} ${req}</label>${input}<div class="err"></div></div>`;
  };
  const renderApplyForm = () => {
    $("#apply").innerHTML = `
      <div class="jc-head"><span class="jc-ic">📝</span><div><small>${esc(A.lead)}</small><h3>${esc(A.title)}</h3></div></div>
      <div class="form-alert" hidden></div>
      <form class="apply-form" novalidate>
        <div class="fields">${A.fields.map(fieldHtml).join("")}</div>
        <button type="submit" class="btn btn-primary form-submit">${esc(A.submitLabel)}</button>
      </form>`;
    const form = $(".apply-form");
    form.addEventListener("submit", onApply);
    form.addEventListener("input", (e) => { const f = e.target.closest(".field"); if (f && f.classList.contains("bad")) validateField(fieldByName(f.dataset.field), form); });
    form.addEventListener("change", (e) => { const f = e.target.closest(".field"); if (f && f.classList.contains("bad")) validateField(fieldByName(f.dataset.field), form); });
  };
  const obj = (w) => { const c = w.charCodeAt(w.length - 1); return w + (c >= 0xac00 && c <= 0xd7a3 && (c - 0xac00) % 28 ? "을" : "를"); };
  const fieldByName = (n) => A.fields.find((f) => f.name === n);
  const valueOf = (f, form) => {
    if (f.type === "radio") { const c = form.querySelector(`input[name="${f.name}"]:checked`); return c ? c.value : ""; }
    if (f.type === "checkbox") return form.querySelector(`[name="${f.name}"]`).checked;
    return form.querySelector(`[name="${f.name}"]`).value.trim();
  };
  const validateField = (f, form) => {
    const v = valueOf(f, form), box = form.querySelector(`[data-field="${f.name}"]`);
    let msg = "";
    if (f.required && (v === "" || v === false)) msg = f.type === "checkbox" ? "동의가 필요합니다." : f.type === "select" || f.type === "radio" ? `${obj(f.label)} 선택해 주세요.` : `${obj(f.label)} 입력해 주세요.`;
    else if (v && f.type === "email" && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) msg = "이메일 형식을 확인해 주세요.";
    else if (v && f.pattern && !new RegExp(f.pattern).test(v)) msg = f.patternMsg || "형식을 확인해 주세요.";
    box.classList.toggle("bad", !!msg);
    $(".err", box).textContent = msg;
    return msg;
  };
  function onApply(e) {
    e.preventDefault();
    const form = e.target, alertBox = $("#apply .form-alert");
    const problems = A.fields.map((f) => ({ f, msg: validateField(f, form) })).filter((x) => x.msg);
    if (problems.length) {
      alertBox.hidden = false;
      alertBox.innerHTML = `<b>⚠️ ${problems.length}개 항목을 확인해 주세요</b><ul>${problems.map((p) => `<li data-go="${esc(p.f.name)}">${esc(p.f.type === "checkbox" ? "개인정보 동의" : p.f.label)} — ${esc(p.msg)}</li>`).join("")}</ul>`;
      alertBox.scrollIntoView({ behavior: "smooth", block: "center" });
      const first = form.querySelector(`[data-field="${problems[0].f.name}"] input, [data-field="${problems[0].f.name}"] select, [data-field="${problems[0].f.name}"] textarea`);
      setTimeout(() => first && first.focus({ preventScroll: true }), 400);
      return;
    }
    alertBox.hidden = true;
    const data = { submittedAt: new Date().toISOString() };
    A.fields.forEach((f) => (data[f.name] = valueOf(f, form)));
    const apps = store.get("applications", []);
    store.set("applications", apps.filter((a) => a.studentId !== data.studentId).concat(data));
    store.set("my-application", data);
    renderApplyDone();
    fireConfetti();
    toast("수강 신청서가 제출되었습니다 🎉");
  }
  const renderApplyDone = () => {
    const d = store.get("my-application", null);
    if (!d) return renderApplyForm();
    const when = new Date(d.submittedAt);
    $("#apply").innerHTML = `
      <div class="jc-head"><span class="jc-ic">✅</span><div><small>제출 완료</small><h3>수강 신청이 접수되었습니다</h3></div></div>
      <div class="apply-done">
        <dl>${A.fields.filter((f) => f.type !== "checkbox").map((f) => `<dt>${esc(f.label)}</dt><dd>${esc(d[f.name] || "—")}</dd>`).join("")}</dl>
        <p class="muted">제출 시각 ${esc(when.toLocaleString("ko-KR"))}</p>
        <p class="muted">이제 아래 <b>수강생 공간</b>에서 학번과 이름으로 로그인할 수 있어요.</p>
        <div class="row-btns">
          <button class="btn btn-ghost" id="editApply">다시 작성하기</button>
          <a class="btn btn-primary" href="#portal">수강생 공간으로 →</a>
        </div>
      </div>`;
    $("#editApply").onclick = () => {
      renderApplyForm();
      const form = $(".apply-form");
      A.fields.forEach((f) => {
        const v = d[f.name];
        if (f.type === "radio") { const r = form.querySelector(`input[name="${f.name}"][value="${CSS.escape(v || "")}"]`); if (r) r.checked = true; }
        else if (f.type === "checkbox") form.querySelector(`[name="${f.name}"]`).checked = !!v;
        else form.querySelector(`[name="${f.name}"]`).value = v || "";
      });
    };
  };
  $("#apply").addEventListener("click", (e) => {
    const li = e.target.closest("[data-go]");
    if (li) { const el = $(`#apply [data-field="${li.dataset.go}"]`); el.scrollIntoView({ behavior: "smooth", block: "center" }); const inp = el.querySelector("input,select,textarea"); inp && setTimeout(() => inp.focus({ preventScroll: true }), 350); }
  });
  store.get("my-application", null) ? renderApplyDone() : renderApplyForm();

  /* =========================================================
   * 3) 로그인 · 출석 · 과제 제출
   * ========================================================= */
  const T = P.portal;
  const hwWeeks = weeks.filter((w) => w.assignment);
  const classWeeks = weeks;
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const fmtSize = (b) => (b > 1048576 ? (b / 1048576).toFixed(1) + "MB" : Math.max(1, Math.round(b / 1024)) + "KB");
  let pendingHw = null; // 커리큘럼 '제출하기'에서 넘어온 주차

  const roster = () => {
    const list = T.students.map((s) => ({ id: String(s.id), name: s.name }));
    store.get("applications", []).forEach((a) => { if (!list.some((s) => s.id === a.studentId)) list.push({ id: a.studentId, name: a.name }); });
    return list;
  };
  const user = () => store.get("session", null);
  const userKey = (k) => `${k}:${user().id}`;

  const renderPortal = () => (user() ? renderDashboard() : renderLogin());

  const renderLogin = () => {
    const demo = T.students[0];
    $("#portal").innerHTML = `
      <div class="jc-head"><span class="jc-ic">🔐</span><div><small>${esc(T.lead)}</small><h3>${esc(T.title)}</h3></div></div>
      <form class="login-form" novalidate>
        <div class="field"><label for="lg-id">학번</label><input id="lg-id" inputmode="numeric" placeholder="학번 10자리" autocomplete="off"></div>

    $(".modal-x", modal).onclick = closePopup;
    $("#pu-close").onclick = closePopup;

  };
  let adminOn = false; try { adminOn = sessionStorage.getItem("fa-site:admin") === "1"; } catch (e) {}
  if (/[?&]quiz=/.test(location.search)) adminOn = true; // 퀴즈 입장(QR)으로 들어온 탭에는 팝업을 띄우지 않음
  if (PU.enabled && !adminOn && store.get("popup-hide", "") !== ymd(new Date())) {
    setTimeout(openPopup, (Number(PU.delaySeconds) || 0) * 1000);
  }

  /* =========================================================
   * 5) 폭죽 효과
   * ========================================================= */
  const canvas = $("#confetti"), ctx = canvas.getContext("2d");
  const COLORS = ["#c8925f", "#8a5a3c", "#e9d3b4", "#f3e6d0", "#5a3726", "#d9a441", "#ffffff"];
  let parts = [], running = false;
  function fireConfetti() {
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const dpr = window.devicePixelRatio || 1;
    canvas.width = innerWidth * dpr; canvas.height = innerHeight * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const burst = (x, y, n) => {
      for (let i = 0; i < n; i++) {
        const a = Math.random() * Math.PI * 2, sp = 4 + Math.random() * 9;
        parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 6, g: 0.22 + Math.random() * 0.1, s: 5 + Math.random() * 7,
          r: Math.random() * 6, vr: (Math.random() - 0.5) * 0.3, c: COLORS[(Math.random() * COLORS.length) | 0], life: 0, petal: Math.random() < 0.35 });
      }
    };
    burst(innerWidth * 0.2, innerHeight * 0.35, 90);
    setTimeout(() => burst(innerWidth * 0.8, innerHeight * 0.3, 90), 250);
    setTimeout(() => burst(innerWidth * 0.5, innerHeight * 0.2, 110), 550);
    canvas.classList.add("on");
    if (!running) { running = true; requestAnimationFrame(loop); }
  }
  function loop() {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    parts.forEach((p) => {
      p.vx *= 0.985; p.vy = p.vy * 0.985 + p.g; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life++;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r);
      ctx.globalAlpha = Math.max(0, 1 - p.life / 200);
      ctx.fillStyle = p.c;
      if (p.petal) { ctx.beginPath(); ctx.ellipse(0, 0, p.s * 0.6, p.s * 0.35, 0, 0, Math.PI * 2); ctx.fill(); }
      else ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2);
      ctx.restore();
    });
    parts = parts.filter((p) => p.life < 200 && p.y < innerHeight + 40);
    if (parts.length) requestAnimationFrame(loop);
    else { running = false; canvas.classList.remove("on"); ctx.clearRect(0, 0, innerWidth, innerHeight); }
  }
  U.fireConfetti = fireConfetti;

  if (C.welcomeConfetti && !store.get("visited", false)) {
    store.set("visited", true);
    setTimeout(() => { fireConfetti(); toast("처음 오셨군요! 환영합니다 🎉"); }, 600);
  }

  /* ── 나타나기 애니메이션 ── */
  const io = new IntersectionObserver((es) => es.forEach((en) => { if (en.isIntersecting) { en.target.classList.add("in"); io.unobserve(en.target); } }), { threshold: 0.1 });
  $$(".pj, #participate .section-head, .demo-note").forEach((el) => { el.classList.add("reveal"); io.observe(el); });
})();
</script>

(function () {

  /* =========================================================

  (function renderNotices() {
